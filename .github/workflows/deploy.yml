name: Deploy POMS

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      deploy_target:
        description: Deployment target
        required: true
        default: frontend
        type: choice
        options:
          - frontend
          - backend
      reconcile_server_changes:
        description: Back up the inspected server edits before synchronizing its checkout
        required: false
        default: false
        type: boolean
      server_snapshot_manifest:
        description: Reviewed manifest from Inspect production checkout (required for reconciliation)
        required: false
        type: string

permissions:
  contents: read

jobs:
  detect:
    name: Detect application changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend_changed: ${{ steps.changes.outputs.frontend_changed }}
      backend_changed: ${{ steps.changes.outputs.backend_changed }}
      backend_ci_required: ${{ steps.changes.outputs.backend_ci_required }}
      frontend_deps_changed: ${{ steps.changes.outputs.frontend_deps_changed }}
      backend_deps_changed: ${{ steps.changes.outputs.backend_deps_changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect changed paths
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          DEPLOY_TARGET: ${{ inputs.deploy_target }}
          FORCE_FRONTEND: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-frontend]') }}
        run: node backend/deploy/detect-changes.cjs

  backend_ci:
    name: Build and test backend on CI
    needs: detect
    if: needs.detect.outputs.backend_ci_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: poms-backend-ci-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_NAME: poms_ci
      DB_USER: poms_ci
      DB_PASSWORD: ""
      BOILER_DB_HOST: 127.0.0.1
      LOG_LEVEL: error
      DIW_USER_LOGIN_ENABLED: "false"
      DIW_OFFICER_LOGIN_ENABLED: "false"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Generate isolated test keys
        run: |
          node -e 'const fs = require("node:fs"), crypto = require("node:crypto"); for (const key of ["JWT_SECRET", "JWT_REFRESH_SECRET"]) { const value = crypto.randomBytes(32).toString("hex"); console.log("::add-mask::" + value); fs.appendFileSync(process.env.GITHUB_ENV, key + "=" + value + "\n"); }'
      - name: Install CI dependencies
        run: npm ci
      - name: Test deployment helpers
        run: node --test deploy/detect-changes.test.cjs deploy/release-artifact.test.cjs
      - name: Build backend once
        run: npm run build
      - name: Test backend once
        timeout-minutes: 10
        run: npm test -- --maxWorkers=2 --silent --verbose=false
      - name: Package the verified backend
        if: needs.detect.outputs.backend_changed == 'true'
        run: node deploy/release-artifact.cjs create --backend . --release "$RUNNER_TEMP/poms-backend-release" --sha "$GITHUB_SHA"
      - name: Upload verified backend
        if: needs.detect.outputs.backend_changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: poms-backend-${{ github.sha }}
          path: ${{ runner.temp }}/poms-backend-release/
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Install verified release on production
    needs: [detect, backend_ci]
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' && needs.detect.result == 'success' &&
      (needs.detect.outputs.frontend_changed == 'true' || needs.detect.outputs.backend_changed == 'true') &&
      (needs.detect.outputs.backend_changed != 'true' || needs.backend_ci.result == 'success')
    concurrency:
      group: poms-prod-deploy
      cancel-in-progress: false
    runs-on: [self-hosted, poms, windows, prod]
    timeout-minutes: 45

    defaults:
      run:
        shell: powershell

    env:
      FRONTEND_TARGET: C:\sites\poms
      BACKEND_TARGET: C:\apps\POMS-app\backend
      BACKEND_RELEASE: C:\apps\POMS-app\backend-release
      BACKEND_SERVICE: poms-app-backend
      BACKEND_HEALTH_URL: http://127.0.0.1:3000/health

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          clean: false
          lfs: ${{ needs.detect.outputs.frontend_changed == 'true' }}

      - name: Trust runner workspace
        run: |
          git config --global --add safe.directory "$env:GITHUB_WORKSPACE"

      - name: Clean runner workspace except dependency installs
        run: |
          git reset --hard HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          git clean -ffdx -e backend/node_modules/ -e frontend/node_modules/
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Download verified backend
        if: needs.detect.outputs.backend_changed == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: poms-backend-${{ github.sha }}
          path: ${{ runner.temp }}/poms-backend-artifact-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify and stage the backend artifact
        if: needs.detect.outputs.backend_changed == 'true'
        run: |
          $artifact = Join-Path $env:RUNNER_TEMP 'poms-backend-artifact-${{ github.run_id }}-${{ github.run_attempt }}'
          node .\backend\deploy\release-artifact.cjs verify --release $artifact --sha "${{ github.sha }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($file in @('package.json', 'package-lock.json')) {
            $expected = [System.IO.File]::ReadAllText((Join-Path $artifact $file)).Replace("`r`n", "`n")
            $source = [System.IO.File]::ReadAllText((Join-Path (Get-Location) "backend\$file")).Replace("`r`n", "`n")
            if ($expected -cne $source) { throw "Artifact package metadata differs from checkout: $file" }
            Copy-Item (Join-Path $artifact $file) '.\backend' -Force
          }
          robocopy (Join-Path $artifact 'dist') '.\backend\dist' /MIR /R:3 /W:5 /NFL /NDL /NP
          if ($LASTEXITCODE -gt 7) { throw "Staging backend artifact failed: $LASTEXITCODE" }
          $global:LASTEXITCODE = 0

      - name: Preserve inspected server edits before Git synchronization
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_target == 'backend' && inputs.reconcile_server_changes
        env:
          EXPECTED_SERVER_MANIFEST: ${{ inputs.server_snapshot_manifest }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:EXPECTED_SERVER_MANIFEST)) {
            throw 'A reviewed source manifest is required to reconcile server changes.'
          }
          $manifestPath = Join-Path $env:RUNNER_TEMP "poms-reviewed-source-${{ github.run_id }}.json"
          [System.IO.File]::WriteAllText($manifestPath, $env:EXPECTED_SERVER_MANIFEST, (New-Object System.Text.UTF8Encoding($false)))
          $repoRoot = Split-Path -Parent $env:BACKEND_TARGET
          $backupRoot = Join-Path (Split-Path -Parent $repoRoot) 'POMS-backups'
          node .\backend\deploy\windows\reconcile-production-checkout.cjs --repo $repoRoot --manifest $manifestPath --target "${{ github.sha }}" --backup-root $backupRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Update server git checkout
        if: needs.detect.outputs.frontend_changed == 'true' || needs.detect.outputs.backend_changed == 'true'
        run: |
          $repoRoot = Split-Path -Parent $env:BACKEND_TARGET
          $gitDir = Join-Path $repoRoot '.git'

          if (!(Test-Path $gitDir)) {
            throw "Server repo checkout was not found at $repoRoot"
          }

          Push-Location $repoRoot
          try {
            git fetch origin main
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            git checkout main
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            git pull --ff-only origin main
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            $current = git rev-parse HEAD
            if ($current -ne "${{ github.sha }}") {
              throw "Server checkout is at $current, expected ${{ github.sha }}"
            }

            Write-Host "Server git checkout updated to $current"
          } finally {
            Pop-Location
          }

      - name: Build frontend
        if: needs.detect.outputs.frontend_changed == 'true'
        working-directory: frontend
        timeout-minutes: 15
        run: |
          $clientArchive = [System.IO.File]::OpenRead((Join-Path $PWD 'src\download\DPOMS_Client_v0.8.3b.zip'))
          try {
            if ($clientArchive.ReadByte() -ne 0x50 -or $clientArchive.ReadByte() -ne 0x4B) {
              throw 'DPOMS-Client is not a ZIP archive. Ensure Git LFS files were downloaded.'
            }
          } finally {
            $clientArchive.Dispose()
          }

          $sourceEnv = "C:\apps\POMS-app\frontend\.env.production"
          $workspaceEnv = ".env.production"

          if (!(Test-Path $sourceEnv)) {
            throw "Frontend .env.production was not found at $sourceEnv"
          }

          Copy-Item $sourceEnv $workspaceEnv -Force

          $frontendDepsReady = Test-Path ".\node_modules\.bin\vite.cmd"

          if ("${{ needs.detect.outputs.frontend_deps_changed }}" -eq 'true' -or !$frontendDepsReady) {
            Write-Host "Installing frontend dependencies with npm ci."
            npm ci
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host "Reusing existing frontend node_modules; package files did not change."
          }

          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Deploy frontend to IIS site root
        if: needs.detect.outputs.frontend_changed == 'true'
        run: |
          New-Item -ItemType Directory -Force -Path $env:FRONTEND_TARGET | Out-Null

          robocopy ".\frontend\dist" $env:FRONTEND_TARGET /MIR /R:3 /W:5 /NFL /NDL /NP
          $robocopyExit = $LASTEXITCODE

          if ($robocopyExit -gt 7) {
            throw "robocopy failed with exit code $robocopyExit"
          }

          $global:LASTEXITCODE = 0

          @(
            "sha=${{ github.sha }}"
            "ref=${{ github.ref_name }}"
            "run_id=${{ github.run_id }}"
            "run_number=${{ github.run_number }}"
            "deployed_at=$((Get-Date).ToUniversalTime().ToString('o'))"
          ) | Set-Content -Path (Join-Path $env:FRONTEND_TARGET 'DEPLOYED_SHA.txt') -Encoding utf8

      - name: Prepare backend environment
        if: needs.detect.outputs.backend_changed == 'true'
        run: |
          $sourceEnv = Join-Path $env:BACKEND_TARGET '.env'
          $workspaceEnv = '.\backend\.env'

          if (!(Test-Path $sourceEnv)) {
            throw "Backend .env was not found at $sourceEnv"
          }

          Copy-Item $sourceEnv $workspaceEnv -Force

      - name: Prepare Windows runtime dependencies
        if: needs.detect.outputs.backend_changed == 'true'
        working-directory: backend
        timeout-minutes: 10
        run: |
          $lockHash = (Get-FileHash '.\package-lock.json' -Algorithm SHA256).Hash
          $runtime = node -p "process.platform + '-' + process.arch + '-' + process.versions.modules"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $key = "$lockHash-$runtime"
          $stamp = '.\node_modules\.poms-deps-key'
          $ready = (Test-Path '.\node_modules\express\package.json') -and (Test-Path '.\node_modules\.bin\knex.cmd')
          $cached = if (Test-Path $stamp) { (Get-Content $stamp -Raw).Trim() } else { '' }
          if (!$ready -or $cached -ne $key) {
            npm ci --omit=dev
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Set-Content -Path $stamp -Value $key -Encoding ascii
          } else {
            Write-Host 'Reusing Windows runtime dependencies for the exact lockfile and Node ABI.'
          }

      - name: Prepare backend release
        id: backend_release
        if: needs.detect.outputs.backend_changed == 'true'
        timeout-minutes: 15
        run: |
          if (Test-Path $env:BACKEND_RELEASE) {
            Remove-Item $env:BACKEND_RELEASE -Recurse -Force
          }

          New-Item -ItemType Directory -Force -Path $env:BACKEND_RELEASE | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $env:BACKEND_RELEASE 'dist') | Out-Null

          Copy-Item ".\backend\package.json" $env:BACKEND_RELEASE -Force
          Copy-Item ".\backend\package-lock.json" $env:BACKEND_RELEASE -Force

          $targetNodeModules = Join-Path $env:BACKEND_TARGET 'node_modules'
          $sourceKey = (Get-Content '.\backend\node_modules\.poms-deps-key' -Raw).Trim()
          $targetStamp = Join-Path $targetNodeModules '.poms-deps-key'
          $targetKey = if (Test-Path $targetStamp) { (Get-Content $targetStamp -Raw).Trim() } else { '' }
          $productionDepsReady = Test-Path (Join-Path $targetNodeModules 'express\package.json')
          $installProductionDeps = !$productionDepsReady -or $sourceKey -ne $targetKey
          "install_production_deps=$($installProductionDeps.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          robocopy ".\backend\dist" (Join-Path $env:BACKEND_RELEASE 'dist') /MIR /R:3 /W:5 /NFL /NDL /NP
          $robocopyExit = $LASTEXITCODE

          if ($robocopyExit -gt 7) {
            throw "robocopy failed with exit code $robocopyExit"
          }

          $global:LASTEXITCODE = 0

      - name: Stop backend before migrations
        if: needs.detect.outputs.backend_changed == 'true'
        timeout-minutes: 2
        run: |
          # Freeze config writes while activation history is backfilled and the new hooks are installed.
          Stop-Service -Name $env:BACKEND_SERVICE -Force
          (Get-Service -Name $env:BACKEND_SERVICE).WaitForStatus('Stopped', '00:00:30')

      - name: Run backend database migrations
        if: needs.detect.outputs.backend_changed == 'true'
        working-directory: backend
        timeout-minutes: 5
        env:
          TS_NODE_TRANSPILE_ONLY: "true"
        run: |
          npm run db:migrate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify factory profile activation prerequisites
        if: needs.detect.outputs.backend_changed == 'true'
        working-directory: backend
        timeout-minutes: 2
        run: |
          @'
          (async () => {
            const { env } = require('./dist/config/env');
            console.log('[factory-profile-deploy] mode=' + env.FACTORY_PROFILE_MODE);
            if (env.FACTORY_PROFILE_MODE !== 'canonical') return;

            const { db } = require('./dist/config/database');
            try {
              const { runFactoryProfileBackfill } = require('./dist/modules/factory-profiles/factory-profile-backfill');
              const report = await runFactoryProfileBackfill(db, { apply: false });
              console.log(JSON.stringify({
                schemaReady: report.schemaReady,
                readyForCanonical: report.readyForCanonical,
                missingProfiles: report.counts.missingProfiles,
                conflicts: report.counts.conflicts
              }));
              if (!report.readyForCanonical) {
                throw new Error('Canonical factory profiles are not ready');
              }
            } finally {
              await db.destroy();
            }
          })().catch(() => {
            console.error('Factory profile activation preflight failed; inspect readiness before deploying.');
            process.exitCode = 1;
          });
          '@ | node
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Deploy backend service files
        if: needs.detect.outputs.backend_changed == 'true'
        timeout-minutes: 15
        run: |
          Copy-Item (Join-Path $env:BACKEND_RELEASE 'package.json') $env:BACKEND_TARGET -Force
          Copy-Item (Join-Path $env:BACKEND_RELEASE 'package-lock.json') $env:BACKEND_TARGET -Force

          if ("${{ steps.backend_release.outputs.install_production_deps }}" -eq 'true') {
            robocopy '.\backend\node_modules' (Join-Path $env:BACKEND_TARGET 'node_modules') /MIR /R:3 /W:5 /NFL /NDL /NP
            $robocopyExit = $LASTEXITCODE

            if ($robocopyExit -gt 7) {
              throw "robocopy node_modules failed with exit code $robocopyExit"
            }

            $global:LASTEXITCODE = 0
          }

          robocopy (Join-Path $env:BACKEND_RELEASE 'dist') (Join-Path $env:BACKEND_TARGET 'dist') /MIR /R:3 /W:5 /NFL /NDL /NP
          $robocopyExit = $LASTEXITCODE

          if ($robocopyExit -gt 7) {
            throw "robocopy dist failed with exit code $robocopyExit"
          }

          $global:LASTEXITCODE = 0

      - name: Restart backend and verify health
        if: needs.detect.outputs.backend_changed == 'true'
        run: |
          Start-Service -Name $env:BACKEND_SERVICE

          $deadline = (Get-Date).AddSeconds(60)
          do {
            try {
              $response = Invoke-WebRequest $env:BACKEND_HEALTH_URL -UseBasicParsing -TimeoutSec 5
              if ($response.StatusCode -eq 200) {
                Write-Host "Backend health check passed: $($response.Content)"
                exit 0
              }
            } catch {
              Write-Host "Waiting for backend health check: $($_.Exception.Message)"
            }

            Start-Sleep -Seconds 2
          } while ((Get-Date) -lt $deadline)

          throw "Backend health check did not pass within 60 seconds."

      - name: Write backend deploy marker
        if: needs.detect.outputs.backend_changed == 'true'
        run: |
          @(
            "sha=${{ github.sha }}"
            "ref=${{ github.ref_name }}"
            "run_id=${{ github.run_id }}"
            "run_number=${{ github.run_number }}"
            "deployed_at=$((Get-Date).ToUniversalTime().ToString('o'))"
          ) | Set-Content -Path (Join-Path $env:BACKEND_TARGET 'DEPLOYED_SHA.txt') -Encoding utf8

      - name: Ensure backend service is running
        if: always() && needs.detect.outputs.backend_changed == 'true'
        run: |
          $service = Get-Service -Name $env:BACKEND_SERVICE
          if ($service.Status -ne 'Running') {
            Start-Service -Name $env:BACKEND_SERVICE
          }

      - name: Remove backend environment copy
        if: always() && needs.detect.outputs.backend_changed == 'true'
        run: |
          Remove-Item ".\backend\.env" -Force -ErrorAction SilentlyContinue

      - name: Report skipped deploy
        if: needs.detect.outputs.frontend_changed != 'true' && needs.detect.outputs.backend_changed != 'true'
        run: |
          Write-Host "No frontend/ or backend/ changes detected. Nothing to deploy."
