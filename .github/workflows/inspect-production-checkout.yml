name: Inspect production checkout

on:
  workflow_dispatch:
    inputs:
      factory_registration_no:
        description: Factory registration reference for read-only geography audit
        required: true
        type: string
      audit_phase:
        description: Read-only geography verification phase
        required: true
        default: preflight
        type: choice
        options: [preflight, post]

permissions:
  contents: read

concurrency:
  group: poms-prod-readonly-address-audit
  cancel-in-progress: false

jobs:
  inspect:
    if: github.ref == 'refs/heads/backend/verify-factory-address-production'
    runs-on: [self-hosted, poms, windows, prod]
    timeout-minutes: 5
    defaults:
      run:
        shell: powershell
    steps:
      - name: Inspect blank factory geography names without changing data
        env:
          POMS_AUDIT_PHASE: ${{ inputs.audit_phase }}
        run: |
          $ErrorActionPreference = 'Stop'
          $OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          Set-Location 'C:\apps\POMS-app'
          $head = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect production SHA.' }
          $changed = @(git diff --name-only HEAD)
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect tracked production changes.' }
          Write-Host ('[factory-area-missing-checkout] ' + (@{ head=$head; trackedChanges=$changed } | ConvertTo-Json -Compress))
          Set-Location 'C:\apps\POMS-app\backend'
          @'
          const {env}=require('./dist/config/env');
          const knex=require('knex');
          const fs=require('fs'),path=require('path');
          const pool=(source=false)=>knex({client:'mssql',acquireConnectionTimeout:10000,connection:{
           server:source?(env.FACTORY_DB_HOST??env.DB_HOST):env.DB_HOST,port:source?(env.FACTORY_DB_PORT??env.DB_PORT):env.DB_PORT,
           user:source?(env.FACTORY_DB_USER??env.DB_USER):env.DB_USER,password:source?(env.FACTORY_DB_PASSWORD??env.DB_PASSWORD):env.DB_PASSWORD,
           database:source?env.FACTORY_DB_NAME:env.DB_NAME,connectionTimeout:10000,requestTimeout:20000,
           options:{encrypt:source?(env.FACTORY_DB_ENCRYPT??env.DB_ENCRYPT):env.DB_ENCRYPT,trustServerCertificate:source?(env.FACTORY_DB_TRUST_SERVER_CERTIFICATE??env.DB_TRUST_SERVER_CERTIFICATE):env.DB_TRUST_SERVER_CERTIFICATE}},pool:{min:0,max:1}});
          const db=pool(),source=pool(true);
          const output=(stage,value)=>console.log('[factory-area-missing-'+stage+'] '+JSON.stringify(value));
          const guard=setTimeout(()=>{output('failure',{code:'TIME_LIMIT'});process.exit(1);},210000);guard.unref();
          const provinces={"10":"\u0e01\u0e23\u0e38\u0e07\u0e40\u0e17\u0e1e\u0e21\u0e2b\u0e32\u0e19\u0e04\u0e23","11":"\u0e2a\u0e21\u0e38\u0e17\u0e23\u0e1b\u0e23\u0e32\u0e01\u0e32\u0e23","12":"\u0e19\u0e19\u0e17\u0e1a\u0e38\u0e23\u0e35","13":"\u0e1b\u0e17\u0e38\u0e21\u0e18\u0e32\u0e19\u0e35","14":"\u0e1e\u0e23\u0e30\u0e19\u0e04\u0e23\u0e28\u0e23\u0e35\u0e2d\u0e22\u0e38\u0e18\u0e22\u0e32","15":"\u0e2d\u0e48\u0e32\u0e07\u0e17\u0e2d\u0e07","16":"\u0e25\u0e1e\u0e1a\u0e38\u0e23\u0e35","17":"\u0e2a\u0e34\u0e07\u0e2b\u0e4c\u0e1a\u0e38\u0e23\u0e35","18":"\u0e0a\u0e31\u0e22\u0e19\u0e32\u0e17","19":"\u0e2a\u0e23\u0e30\u0e1a\u0e38\u0e23\u0e35","20":"\u0e0a\u0e25\u0e1a\u0e38\u0e23\u0e35","21":"\u0e23\u0e30\u0e22\u0e2d\u0e07","22":"\u0e08\u0e31\u0e19\u0e17\u0e1a\u0e38\u0e23\u0e35","23":"\u0e15\u0e23\u0e32\u0e14","24":"\u0e09\u0e30\u0e40\u0e0a\u0e34\u0e07\u0e40\u0e17\u0e23\u0e32","25":"\u0e1b\u0e23\u0e32\u0e08\u0e35\u0e19\u0e1a\u0e38\u0e23\u0e35","26":"\u0e19\u0e04\u0e23\u0e19\u0e32\u0e22\u0e01","27":"\u0e2a\u0e23\u0e30\u0e41\u0e01\u0e49\u0e27","30":"\u0e19\u0e04\u0e23\u0e23\u0e32\u0e0a\u0e2a\u0e35\u0e21\u0e32","31":"\u0e1a\u0e38\u0e23\u0e35\u0e23\u0e31\u0e21\u0e22\u0e4c","32":"\u0e2a\u0e38\u0e23\u0e34\u0e19\u0e17\u0e23\u0e4c","33":"\u0e28\u0e23\u0e35\u0e2a\u0e30\u0e40\u0e01\u0e29","34":"\u0e2d\u0e38\u0e1a\u0e25\u0e23\u0e32\u0e0a\u0e18\u0e32\u0e19\u0e35","35":"\u0e22\u0e42\u0e2a\u0e18\u0e23","36":"\u0e0a\u0e31\u0e22\u0e20\u0e39\u0e21\u0e34","37":"\u0e2d\u0e33\u0e19\u0e32\u0e08\u0e40\u0e08\u0e23\u0e34\u0e0d","38":"\u0e1a\u0e36\u0e07\u0e01\u0e32\u0e2c","39":"\u0e2b\u0e19\u0e2d\u0e07\u0e1a\u0e31\u0e27\u0e25\u0e33\u0e20\u0e39","40":"\u0e02\u0e2d\u0e19\u0e41\u0e01\u0e48\u0e19","41":"\u0e2d\u0e38\u0e14\u0e23\u0e18\u0e32\u0e19\u0e35","42":"\u0e40\u0e25\u0e22","43":"\u0e2b\u0e19\u0e2d\u0e07\u0e04\u0e32\u0e22","44":"\u0e21\u0e2b\u0e32\u0e2a\u0e32\u0e23\u0e04\u0e32\u0e21","45":"\u0e23\u0e49\u0e2d\u0e22\u0e40\u0e2d\u0e47\u0e14","46":"\u0e01\u0e32\u0e2c\u0e2a\u0e34\u0e19\u0e18\u0e38\u0e4c","47":"\u0e2a\u0e01\u0e25\u0e19\u0e04\u0e23","48":"\u0e19\u0e04\u0e23\u0e1e\u0e19\u0e21","49":"\u0e21\u0e38\u0e01\u0e14\u0e32\u0e2b\u0e32\u0e23","50":"\u0e40\u0e0a\u0e35\u0e22\u0e07\u0e43\u0e2b\u0e21\u0e48","51":"\u0e25\u0e33\u0e1e\u0e39\u0e19","52":"\u0e25\u0e33\u0e1b\u0e32\u0e07","53":"\u0e2d\u0e38\u0e15\u0e23\u0e14\u0e34\u0e15\u0e16\u0e4c","54":"\u0e41\u0e1e\u0e23\u0e48","55":"\u0e19\u0e48\u0e32\u0e19","56":"\u0e1e\u0e30\u0e40\u0e22\u0e32","57":"\u0e40\u0e0a\u0e35\u0e22\u0e07\u0e23\u0e32\u0e22","58":"\u0e41\u0e21\u0e48\u0e2e\u0e48\u0e2d\u0e07\u0e2a\u0e2d\u0e19","60":"\u0e19\u0e04\u0e23\u0e2a\u0e27\u0e23\u0e23\u0e04\u0e4c","61":"\u0e2d\u0e38\u0e17\u0e31\u0e22\u0e18\u0e32\u0e19\u0e35","62":"\u0e01\u0e33\u0e41\u0e1e\u0e07\u0e40\u0e1e\u0e0a\u0e23","63":"\u0e15\u0e32\u0e01","64":"\u0e2a\u0e38\u0e42\u0e02\u0e17\u0e31\u0e22","65":"\u0e1e\u0e34\u0e29\u0e13\u0e38\u0e42\u0e25\u0e01","66":"\u0e1e\u0e34\u0e08\u0e34\u0e15\u0e23","67":"\u0e40\u0e1e\u0e0a\u0e23\u0e1a\u0e39\u0e23\u0e13\u0e4c","70":"\u0e23\u0e32\u0e0a\u0e1a\u0e38\u0e23\u0e35","71":"\u0e01\u0e32\u0e0d\u0e08\u0e19\u0e1a\u0e38\u0e23\u0e35","72":"\u0e2a\u0e38\u0e1e\u0e23\u0e23\u0e13\u0e1a\u0e38\u0e23\u0e35","73":"\u0e19\u0e04\u0e23\u0e1b\u0e10\u0e21","74":"\u0e2a\u0e21\u0e38\u0e17\u0e23\u0e2a\u0e32\u0e04\u0e23","75":"\u0e2a\u0e21\u0e38\u0e17\u0e23\u0e2a\u0e07\u0e04\u0e23\u0e32\u0e21","76":"\u0e40\u0e1e\u0e0a\u0e23\u0e1a\u0e38\u0e23\u0e35","77":"\u0e1b\u0e23\u0e30\u0e08\u0e27\u0e1a\u0e04\u0e35\u0e23\u0e35\u0e02\u0e31\u0e19\u0e18\u0e4c","80":"\u0e19\u0e04\u0e23\u0e28\u0e23\u0e35\u0e18\u0e23\u0e23\u0e21\u0e23\u0e32\u0e0a","81":"\u0e01\u0e23\u0e30\u0e1a\u0e35\u0e48","82":"\u0e1e\u0e31\u0e07\u0e07\u0e32","83":"\u0e20\u0e39\u0e40\u0e01\u0e47\u0e15","84":"\u0e2a\u0e38\u0e23\u0e32\u0e29\u0e0e\u0e23\u0e4c\u0e18\u0e32\u0e19\u0e35","85":"\u0e23\u0e30\u0e19\u0e2d\u0e07","86":"\u0e0a\u0e38\u0e21\u0e1e\u0e23","90":"\u0e2a\u0e07\u0e02\u0e25\u0e32","91":"\u0e2a\u0e15\u0e39\u0e25","92":"\u0e15\u0e23\u0e31\u0e07","93":"\u0e1e\u0e31\u0e17\u0e25\u0e38\u0e07","94":"\u0e1b\u0e31\u0e15\u0e15\u0e32\u0e19\u0e35","95":"\u0e22\u0e30\u0e25\u0e32","96":"\u0e19\u0e23\u0e32\u0e18\u0e34\u0e27\u0e32\u0e2a"};
          const provinceByName=new Map(Object.entries(provinces).map(([code,name])=>[name,code]));
          const baseTables=['eligible_factories','factory_profiles','factory_monitoring_point_forms','cems_wpms_connected_measurement_points','cems_wpms_connection_requests','cems_wpms_request_factory_snapshots','eligible_factory_add_requests'];
          const viewTables=['current_eligible_factories','current_factory_monitoring_point_forms','current_connected_measurement_points'];
          const nameFields=['province_name','district_name','subdistrict_name'];
          const codeFields=['province_code','district_code','subdistrict_code'];
          const closed=new Set(['CANCELED','CANCELLED','REJECTED']);
          const blank=value=>value==null||String(value).trim()==='';
          const code=value=>{const s=String(value??'').trim().replace(/[\u0e50-\u0e59]/gu,x=>String(x.charCodeAt(0)-0x0e50));return /^\d+$/u.test(s)?String(Number(s)):null;};
          const sameName=(a,b)=>String(a??'').trim().replace(/^(\u0e08\u0e31\u0e07\u0e2b\u0e27\u0e31\u0e14|\u0e2d\u0e33\u0e40\u0e20\u0e2d|\u0e15\u0e33\u0e1a\u0e25|\u0e41\u0e02\u0e27\u0e07|\u0e40\u0e02\u0e15|\u0e08\.|\u0e2d\.|\u0e15\.)\s*/u,'')===String(b??'').trim();
          const usableName=value=>!blank(value)&&/[\u0e01-\u0e2e]/u.test(String(value))&&!/^(?:-|\u0e44\u0e21\u0e48\u0e23\u0e30\u0e1a\u0e38|\u0e23\u0e2b\u0e31\u0e2a\u0e08\u0e31\u0e07\u0e2b\u0e27\u0e31\u0e14)/u.test(String(value).trim());
          function labels(address){
           const text=String(address??'');const result={province:[],district:[],subdistrict:[]};
           for(const m of text.matchAll(/(\u0e08\u0e31\u0e07\u0e2b\u0e27\u0e31\u0e14|(?<![\u0e01-\u0e59a-zA-Z])\u0e08\.|\u0e2d\u0e33\u0e40\u0e20\u0e2d|\u0e40\u0e02\u0e15|(?<![\u0e01-\u0e59a-zA-Z])\u0e2d\.|\u0e15\u0e33\u0e1a\u0e25|\u0e41\u0e02\u0e27\u0e07|(?<![\u0e01-\u0e59a-zA-Z])\u0e15\.)\s*([\u0e01-\u0e590-9]+?)(?=\s|$|[,;()]|\u0e08\u0e31\u0e07\u0e2b\u0e27\u0e31\u0e14|\u0e2d\u0e33\u0e40\u0e20\u0e2d|\u0e15\u0e33\u0e1a\u0e25|\u0e41\u0e02\u0e27\u0e07|\u0e40\u0e02\u0e15)/gu)){
            const key=['\u0e08\u0e31\u0e07\u0e2b\u0e27\u0e31\u0e14','\u0e08.'].includes(m[1])?'province':['\u0e2d\u0e33\u0e40\u0e20\u0e2d','\u0e40\u0e02\u0e15','\u0e2d.'].includes(m[1])?'district':'subdistrict';result[key].push(m[2]);
           }
           if(text.includes('\u0e01\u0e23\u0e38\u0e07\u0e40\u0e17\u0e1e\u0e21\u0e2b\u0e32\u0e19\u0e04\u0e23'))result.province.push('\u0e01\u0e23\u0e38\u0e07\u0e40\u0e17\u0e1e\u0e21\u0e2b\u0e32\u0e19\u0e04\u0e23');return result;
          }
          function areaCodeMatches(value,area,subdistrict){
           const n=code(value),local=code(subdistrict?area.TUMBOL:area.AMP);if(n==null||local==null)return false;if(n===local)return true;
           const p=code(area.PROV),d=code(area.AMP);return n===(subdistrict?`${p.padStart(2,'0')}${d.padStart(2,'0')}${local.padStart(2,'0')}`:`${p.padStart(2,'0')}${local.padStart(2,'0')}`);
          }
          function resolve(row,areas,localProvinces){
           const addressEvidenceAllowed=row.table!=='cems_wpms_request_factory_snapshots'||row.deleted_at_exact==null;
           const address=row.address??row.factory_address??(addressEvidenceAllowed?row.request_address:null);
           const parts=labels(address),pc=[];const conflicts=[];
           if(usableName(row.province_name)){const p=provinceByName.get(String(row.province_name).trim().replace(/^\u0e08\u0e31\u0e07\u0e2b\u0e27\u0e31\u0e14\s*/u,''));if(p)pc.push(p);else conflicts.push('UNKNOWN_RECORDED_PROVINCE_NAME');}
           for(const name of parts.province){const p=provinceByName.get(name);if(p)pc.push(p);else conflicts.push('UNKNOWN_ADDRESS_PROVINCE_NAME');}
           const rawP=code(row.province_code);if(rawP&&rawP.length===2&&provinces[rawP])pc.push(rawP);
           else if(rawP&&localProvinces.has(rawP))pc.push(localProvinces.get(rawP));
           for(const c of [row.district_code,...parts.district])if(code(c)?.length===4)pc.push(code(c).slice(0,2));
           for(const c of [row.subdistrict_code,...parts.subdistrict])if(code(c)?.length===6)pc.push(code(c).slice(0,2));
           const provinceCodes=[...new Set(pc)];if(provinceCodes.length>1)conflicts.push('PROVINCE_CONTEXT_CONFLICT');
           const districts=[row.district_code,...parts.district].filter(x=>!blank(x));
           const subdistricts=[row.subdistrict_code,...parts.subdistrict].filter(x=>!blank(x));
           if(!blank(row.district_name))districts.push(row.district_name);
           if(!blank(row.subdistrict_name))subdistricts.push(row.subdistrict_name);
           const hasContext=provinceCodes.length||districts.length||subdistricts.length;
           const matches=!conflicts.length&&hasContext?areas.filter(a=>
            (!provinceCodes.length||code(a.PROV)===provinceCodes[0])&&
            districts.every(x=>code(x)!=null?areaCodeMatches(x,a,false):sameName(x,a.AMPNAME))&&
            subdistricts.every(x=>code(x)!=null?areaCodeMatches(x,a,true):sameName(x,a.TUMNAME))):[];
           const uniqueValues=field=>[...new Set(matches.map(a=>field==='province_name'?provinces[code(a.PROV)]:field==='district_name'?a.AMPNAME:a.TUMNAME).filter(usableName).map(x=>String(x).trim()))];
           const proposed={};for(const field of row.existing_name_fields)if(blank(row[field])){const names=uniqueValues(field);if(names.length===1)proposed[field]=names[0];}
           if(hasContext&&!matches.length&&!conflicts.length)conflicts.push('NO_MASTER_MATCH');
           return {address_evidence_allowed:addressEvidenceAllowed,address_evidence:address??null,address_labels:parts,province_codes:provinceCodes,
            candidate_count:matches.length,candidates:matches.length<=8?matches.map(a=>({PROV:code(a.PROV),AMP:code(a.AMP),TUMBOL:code(a.TUMBOL),province_name:provinces[code(a.PROV)]??null,AMPNAME:a.AMPNAME,TUMNAME:a.TUMNAME})):[],
            distinct_names:{province_name:uniqueValues('province_name'),district_name:uniqueValues('district_name'),subdistrict_name:uniqueValues('subdistrict_name')},
            conflicts,proposed_patch:proposed,resolution:conflicts.length?'CONFLICT':Object.keys(proposed).length?'FILL_CANDIDATE':hasContext?'AMBIGUOUS_OR_INCOMPLETE':'NO_RECORDED_CONTEXT'};
          }
          (async()=>{
           try{
            const [clock]=await db.raw('SELECT CONVERT(VARCHAR(33),SYSDATETIME(),126) AS server_time,CONVERT(VARCHAR(33),SYSUTCDATETIME(),126) AS server_utc').timeout(10000);output('clock',clock);
            const metadata=await db('INFORMATION_SCHEMA.COLUMNS AS c').join('INFORMATION_SCHEMA.TABLES AS t',function(){this.on('t.TABLE_SCHEMA','=','c.TABLE_SCHEMA').andOn('t.TABLE_NAME','=','c.TABLE_NAME');})
             .where('c.TABLE_SCHEMA','dbo').select('c.TABLE_NAME','t.TABLE_TYPE','c.COLUMN_NAME','c.DATA_TYPE','c.IS_NULLABLE','c.ORDINAL_POSITION').orderBy('c.TABLE_NAME').orderBy('c.ORDINAL_POSITION').timeout(15000);
            const inventory=[];for(const table of [...new Set(metadata.map(x=>x.TABLE_NAME))]){
             const cols=metadata.filter(x=>x.TABLE_NAME===table);const relevant=cols.filter(x=>/province|district|subdistrict|address/i.test(x.COLUMN_NAME));
             const historical=/(snapshot|history|revision|edit_request)/i.test(table)&&/(factory|cems_wpms|monitoring)/i.test(table);
             if(relevant.length||historical)inventory.push({table,type:cols[0].TABLE_TYPE,repair_scope:baseTables.includes(table)?'BASE_CANDIDATE':viewTables.includes(table)?'DERIVED_VIEW':table==='factories'?'SUPPORTING_FACTORY_EXCLUDED':'DISCOVERY_ONLY',
              columns:(historical?cols.filter(x=>/province|district|subdistrict|address|json|request_id|created_at|updated_at|deleted_at|status/i.test(x.COLUMN_NAME)):relevant).map(({COLUMN_NAME,DATA_TYPE,IS_NULLABLE,ORDINAL_POSITION})=>({name:COLUMN_NAME,type:DATA_TYPE,nullable:IS_NULLABLE,ordinal:ORDINAL_POSITION}))});
            }
            output('schema',inventory);
            const areas=await source(`${env.FACTORY_DB_SCHEMA}.TUMBOL`).select('PROV','AMP','TUMBOL','AMPNAME','TUMNAME').timeout(20000);
            const localProvinceRows=await db('provinces').select('id','name_th').timeout(10000);
            const localProvinces=new Map(localProvinceRows.map(x=>[String(x.id),provinceByName.get(String(x.name_th).trim())]).filter(([,p])=>p));
            output('master-summary',{rows:areas.length,localProvinceMappings:localProvinces.size,source:'TUMBOL; no Fac60k location fallback'});
            const desired=['id','eligible_factory_id','request_id','factory_id','source_factory_id','factory_registration_no_new','factory_registration_no_old','factory_registration_no','factory_name','request_no','status','is_open','monitoring_point_form_id',...nameFields,...codeFields,'address','factory_address'];
            const records=new Map();
            for(const table of [...baseTables,...viewTables]){
             const cols=metadata.filter(x=>x.TABLE_NAME===table);if(!cols.length){output('table',{table,missing:true});continue;}
             const names=new Set(cols.map(x=>x.COLUMN_NAME));const q=db(table+' as row').select(desired.filter(x=>names.has(x)).map(x=>'row.'+x));
             for(const field of ['created_at','updated_at','deleted_at'])if(names.has(field))q.select(db.raw('CONVERT(VARCHAR(33),??,126) AS ??',['row.'+field,field+'_exact']));
             records.set(table,await q.timeout(20000));
            }
            const requests=new Map((records.get('cems_wpms_connection_requests')||[]).map(x=>[String(x.id),x]));
            const eligible=new Map((records.get('eligible_factories')||[]).map(x=>[String(x.id),x]));
            const baselines=[];const summaries=[];
            for(const [table,rows] of records){
             const cols=metadata.filter(x=>x.TABLE_NAME===table);const existingNames=nameFields.filter(field=>cols.some(c=>c.COLUMN_NAME===field));
             const summariesByName={};for(const field of existingNames)summariesByName[field]={null:0,empty:0,whitespace:0,active_missing:0,historic_missing:0};
             const candidates=[];let conflicts=0;let blankRows=0;
             for(const raw of rows){
              const row={...raw,table,existing_name_fields:existingNames};let active=row.deleted_at_exact==null&&!closed.has(row.status);
              if(table==='cems_wpms_request_factory_snapshots'){
               const parent=requests.get(String(row.request_id));row.request_address=parent?.address??null;row.request_factory_id=parent?.factory_id??null;row.request_factory_name=parent?.factory_name??null;row.request_no=parent?.request_no??null;
               row.request_status=parent?.status??null;row.request_created_at_exact=parent?.created_at_exact??null;row.request_updated_at_exact=parent?.updated_at_exact??null;row.request_deleted_at_exact=parent?.deleted_at_exact??null;
               active=active&&Boolean(parent)&&parent.deleted_at_exact==null&&!closed.has(parent.status);
              }
              if(table==='factory_profiles'||table==='cems_wpms_connected_measurement_points'){const parent=eligible.get(String(row.eligible_factory_id));row.parent_province_name=parent?.province_name??null;row.parent_address=parent?.address??null;active=active&&Boolean(parent)&&parent.deleted_at_exact==null;}
              row.active=active;row.missing_name_fields=existingNames.filter(field=>blank(row[field]));
              for(const field of row.missing_name_fields){const count=summariesByName[field];if(row[field]==null)count.null++;else if(String(row[field])==='')count.empty++;else count.whitespace++;count[active?'active_missing':'historic_missing']++;}
              const resolved=resolve(row,areas,localProvinces);if(resolved.conflicts.length)conflicts++;
              if(row.missing_name_fields.length)blankRows++;
              const target=String(row.factory_id??row.source_factory_id??row.factory_registration_no_new??row.request_factory_id??'')==='82250600225587'||['10376','10377'].includes(String(table==='cems_wpms_request_factory_snapshots'?row.request_id:table==='cems_wpms_connection_requests'?row.id:''));
              if(row.missing_name_fields.length||resolved.conflicts.length||target)candidates.push({...row,resolution:resolved});
             }
             summaries.push({table,type:cols[0].TABLE_TYPE,total_rows:rows.length,existing_name_fields:existingNames,missing_rows:blankRows,conflict_rows:conflicts,counts:summariesByName,read_mode:'committed; no READPAST/NOLOCK'});
             if(baseTables.includes(table)&&candidates.length){
              const unchanged=cols.map(x=>x.COLUMN_NAME).filter(x=>!existingNames.includes(x));
              const hashSql="CONVERT(VARCHAR(64),HASHBYTES('SHA2_256',(SELECT "+unchanged.map(()=> '??').join(',')+" FOR JSON PATH,INCLUDE_NULL_VALUES,WITHOUT_ARRAY_WRAPPER)),2) AS non_name_hash";
              for(let offset=0;offset<candidates.length;offset+=250){
               const chunk=candidates.slice(offset,offset+250);const hashes=await db(table+' as row').whereIn('row.id',chunk.map(x=>x.id)).select('row.id').select(db.raw(hashSql,unchanged.map(x=>'row.'+x))).timeout(20000);
               for(const row of chunk)row.non_name_hash=hashes.find(x=>String(x.id)===String(row.id))?.non_name_hash??null;
              }
             }
             baselines.push(...candidates);
            }
            output('table-summaries',summaries);
            for(const table of [...baseTables,...viewTables]){const rows=baselines.filter(x=>x.table===table);if(rows.length)output('baseline',{table,rows});}
            const artifact={clock,schema:inventory,table_summaries:summaries,rows:baselines,master_rows:areas,local_province_mappings:[...localProvinces],mutations:false,
             history_policy:'Deleted snapshots resolve from own codes/names only. Current request address is reference-only for deleted snapshots; request/snapshot timestamps included. No Fac60k current-location fallback.'};
            const artifactPath=path.join(process.env.RUNNER_TEMP||process.env.TEMP||process.cwd(),'poms-area-missing-audit.json');fs.writeFileSync(artifactPath,JSON.stringify(artifact));
            output('artifact',{path:artifactPath,bytes:fs.statSync(artifactPath).size,baseline_rows:baselines.length,master_rows:areas.length});
            output('result',{complete:true,mutations:false,base_missing_rows:summaries.filter(x=>baseTables.includes(x.table)).reduce((n,x)=>n+x.missing_rows,0),base_conflict_rows:summaries.filter(x=>baseTables.includes(x.table)).reduce((n,x)=>n+x.conflict_rows,0)});
           }finally{clearTimeout(guard);await Promise.allSettled([db.destroy(),source.destroy()]);}
          })().catch(error=>{output('failure',{code:error.code||error.name,number:error.number||error.originalError?.info?.number||null});process.exitCode=1;});
          '@ | node
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
