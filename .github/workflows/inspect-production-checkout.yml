name: Inspect production checkout

on:
  workflow_dispatch:
    inputs:
      factory_registration_no:
        description: Reference only; inspect session 87 without changing database data
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: poms-prod-readonly-address-audit
  cancel-in-progress: false

jobs:
  inspect:
    if: github.ref == 'refs/heads/backend/verify-factory-address-production'
    runs-on: [self-hosted, poms, windows, prod]
    timeout-minutes: 5
    defaults:
      run:
        shell: powershell
    steps:
      - name: Inspect session 87 transaction and affected resources without changing data
        run: |
          $ErrorActionPreference = 'Stop'
          $OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          Set-Location 'C:\apps\POMS-app\backend'
          $service = Get-CimInstance Win32_Service -Filter "Name='poms-app-backend'" | Select-Object Name, ProcessId, State
          $nodes = @(Get-CimInstance Win32_Process -Filter "Name='node.exe'" | Select-Object ProcessId, ParentProcessId, CreationDate)
          Write-Host ('[session87-readonly-process] ' + (@{ service=$service; nodes=$nodes } | ConvertTo-Json -Compress -Depth 4))
          @'
          const { env } = require('./dist/config/env');
          const knex = require('knex');
          const db = knex({ client: 'mssql', acquireConnectionTimeout: 10000,
            connection: { server: env.DB_HOST, port: env.DB_PORT, user: env.DB_USER,
              password: env.DB_PASSWORD, database: env.DB_NAME, connectionTimeout: 10000,
              requestTimeout: 15000, options: { encrypt: env.DB_ENCRYPT,
                trustServerCertificate: env.DB_TRUST_SERVER_CERTIFICATE } },
            pool: { min: 0, max: 1 },
          });
          const sessionId = 87;
          const output = (stage, value) => console.log('[session87-readonly-' + stage + '] ' + JSON.stringify(value));
          const guard = setTimeout(() => { output('failure', { code: 'TIME_LIMIT' }); process.exit(1); }, 150000);
          guard.unref();
          function statementSummary(text) {
            const original = String(text || '');
            let sql = original;
            const wrapped = /sp_executesql\s+N?'((?:''|[^'])*)'/iu.exec(sql);
            if (wrapped) sql = wrapped[1].replace(/''/gu, "'");
            const noComments = sql.replace(/\/\*[\s\S]*?\*\//gu, ' ').replace(/--[^\r\n]*/gu, ' ');
            const withoutLiterals = noComments.replace(/N?'(?:''|[^'])*'/giu, "'<REDACTED>'")
              .replace(/0x[\da-f]+/giu, '<BINARY>');
            const operations = [...new Set((withoutLiterals.match(/\b(?:DELETE|UPDATE|INSERT|SELECT|MERGE|COMMIT|ROLLBACK)\b/giu) || []).map(x => x.toUpperCase()))];
            const tables = [...new Set([...withoutLiterals.matchAll(/\b(?:from|join|update|into)\s+((?:\[?[a-z_][\w]*\]?\.)?\[?[a-z_][\w]*\]?)/giu)].map(x => x[1]))];
            const predicates = [...noComments.matchAll(/\[?(id|request_id|eligible_factory_id|source_request_id|source_measurement_point_id|factory_registration_no|factory_id)\]?\s*=\s*(@[\w]+|N?'\d+'|\d+)/giu)]
              .map(x => ({ column: x[1], value: x[2] }));
            const bindings = [];
            for (const predicate of predicates) {
              if (!predicate.value.startsWith('@')) continue;
              const name = predicate.value.replace(/[.*+?^${}()|[\]\\]/gu, '\\$&');
              const value = new RegExp(name + "\\s*=\\s*N?'?(\\d+)'?(?=\\s*(?:,|;|$))", 'iu').exec(original)?.[1];
              if (value) bindings.push({ column: predicate.column, parameter: predicate.value, value });
            }
            return { operations, tables, predicates, numericIdentityBindings: bindings,
              queryShape: withoutLiterals.replace(/\b\d+(?:\.\d+)?\b/gu, '?').replace(/\s+/gu, ' ').slice(0, 2200) };
          }
          async function query(stage, sql, bindings = []) {
            try { const rows = await db.raw(sql, bindings).timeout(15000); output(stage, rows); return rows; }
            catch (error) { output(stage, { error: error.code || error.name, number: error.number || error.originalError?.info?.number || null }); return null; }
          }
          (async () => {
           try {
            await query('followup-clock', `SELECT CONVERT(VARCHAR(33), SYSDATETIME(), 126) AS server_time,
              CONVERT(VARCHAR(33), SYSUTCDATETIME(), 126) AS server_utc`);
            await query('backend-sessions', `SELECT s.session_id, s.status, s.program_name, s.host_process_id,
              s.open_transaction_count, CONVERT(VARCHAR(33), s.login_time, 126) AS login_time,
              CONVERT(VARCHAR(33), s.last_request_end_time, 126) AS last_request_end_time,
              CONVERT(VARCHAR(32), st.transaction_id) AS transaction_id,
              CONVERT(VARCHAR(33), t.transaction_begin_time, 126) AS transaction_begin_time,
              t.transaction_state, dt.database_id, dt.database_transaction_log_record_count
              FROM sys.dm_exec_sessions s
              LEFT JOIN sys.dm_tran_session_transactions st ON st.session_id=s.session_id
              LEFT JOIN sys.dm_tran_active_transactions t ON t.transaction_id=st.transaction_id
              LEFT JOIN sys.dm_tran_database_transactions dt ON dt.transaction_id=st.transaction_id
              WHERE s.host_process_id=? AND s.program_name='knex'`, [5036]);
            await query('old-transaction-still-present', `SELECT CONVERT(VARCHAR(32), t.transaction_id) AS transaction_id,
              CONVERT(VARCHAR(33), t.transaction_begin_time, 126) AS transaction_begin_time, t.transaction_state,
              st.session_id, s.host_process_id, s.program_name
              FROM sys.dm_tran_active_transactions t LEFT JOIN sys.dm_tran_session_transactions st ON st.transaction_id=t.transaction_id
              LEFT JOIN sys.dm_exec_sessions s ON s.session_id=st.session_id
              WHERE t.transaction_begin_time=CONVERT(DATETIME, ?)`, ['2026-10-30T15:16:59.940']);
            await query('current-blockers', `SELECT r.session_id, r.command, r.status, r.blocking_session_id,
              r.wait_type, r.wait_time, r.wait_resource, s.host_process_id, s.program_name
              FROM sys.dm_exec_requests r JOIN sys.dm_exec_sessions s ON s.session_id=r.session_id
              WHERE r.database_id=DB_ID() AND r.blocking_session_id>0`);
            const oldResource = await query('old-resource-index', `SELECT SCHEMA_NAME(o.schema_id) AS schema_name,
              o.name AS object_name, i.name AS index_name, i.index_id, p.hobt_id
              FROM sys.partitions p JOIN sys.objects o ON o.object_id=p.object_id
              JOIN sys.indexes i ON i.object_id=p.object_id AND i.index_id=p.index_id
              WHERE p.hobt_id=CONVERT(BIGINT, ?)`, ['72057594050052096']);
            const tables = ['eligible_factories','factory_profiles','cems_wpms_connected_measurement_points',
              'factory_monitoring_point_forms','current_eligible_factories','current_connected_measurement_points',
              'current_factory_monitoring_point_forms','cems_wpms_connection_requests','cems_wpms_request_factory_snapshots'];
            const candidates = ['id','eligible_factory_id','request_id','factory_id','factory_registration_no_new',
              'factory_registration_no','request_no','request_number','factory_name','status','deleted_at',
              'created_at','updated_at','address','factory_address','district_name','subdistrict_name'];
            const columns = await db('INFORMATION_SCHEMA.COLUMNS').where('TABLE_SCHEMA','dbo').whereIn('TABLE_NAME',tables)
              .select('TABLE_NAME','COLUMN_NAME').timeout(10000);
            const byTable = new Map(tables.map(table => [table,new Set(columns.filter(x => x.TABLE_NAME===table).map(x => x.COLUMN_NAME))]));
            const broad = /(?:\u0e15\u0e33\u0e1a\u0e25|\u0e2d\u0e33\u0e40\u0e20\u0e2d|\u0e41\u0e02\u0e27\u0e07|\u0e40\u0e02\u0e15|\u0e15\.|\u0e2d\.)\s*[:.\-]?\s*[0-9\u0e50-\u0e59]+/u;
            const numericName = /^\s*[0-9\u0e50-\u0e59]+\s*$/u;
            const records = new Map();
            const scan=[];
            for (const table of tables) {
              const selected=candidates.filter(column=>byTable.get(table).has(column));
              if (!selected.length) { scan.push({table,missing:true}); continue; }
              try {
                const rows=await db(table).select(selected).timeout(15000);
                records.set(table,rows);
                const issues=rows.flatMap(row=>['address','factory_address','district_name','subdistrict_name']
                  .filter(field => row[field]!=null && (broad.test(String(row[field])) || (field.endsWith('_name') && numericName.test(String(row[field])))))
                  .map(field=>({id:row.id,field,status:row.status||null,deleted:row.deleted_at!=null})));
                scan.push({table,rows:rows.length,readPast:false,numericIssues:issues});
              } catch(error) { scan.push({table,error:error.code||error.name}); }
            }
            output('committed-scan',scan);
            for (const resource of oldResource || []) {
              if (!tables.includes(resource.object_name) || resource.schema_name!=='dbo') continue;
              const selected=candidates.filter(column=>byTable.get(resource.object_name).has(column));
              try {
                const matches=await db.fromRaw('?? WITH (INDEX(??))',[resource.schema_name+'.'+resource.object_name,resource.index_name])
                  .select(selected).select(db.raw('%%lockres%% AS lock_resource'))
                  .whereRaw('%%lockres%% = ?',['(29825665d988)']).timeout(15000);
                output('old-key-current-matches', {table:resource.object_name,index:resource.index_name,matches});
                const requestIds=matches.map(row => resource.object_name==='cems_wpms_connection_requests'?String(row.id):String(row.request_id||''));
                if (requestIds.length) {
                  output('old-key-related-requests',(records.get('cems_wpms_connection_requests')||[]).filter(row=>requestIds.includes(String(row.id))));
                  output('old-key-related-snapshots',(records.get('cems_wpms_request_factory_snapshots')||[]).filter(row=>requestIds.includes(String(row.request_id))));
                  const histories=await db('cems_wpms_request_status_history').whereIn('request_id',requestIds)
                    .select('id','request_id','status','changed_at').orderBy('changed_at','asc').timeout(10000);
                  output('old-key-history',histories);
                }
              } catch(error) { output('old-key-current-matches',{error:error.code||error.name,number:error.number||error.originalError?.info?.number||null}); }
            }
            await query('history-capabilities', `SELECT actual_state_desc, desired_state_desc FROM sys.database_query_store_options`);
            const fs = require('fs'); const path = require('path');
            const logRoot = path.resolve('logs');
            if (fs.existsSync(logRoot)) {
              const files=fs.readdirSync(logRoot).filter(name=>/^(?:app|error)-2026-10-30[^/\\]*\.log$/u.test(name));
              const evidence=[];
              for (const name of files.slice(-6)) {
                const file=path.join(logRoot,name); const stat=fs.statSync(file); const size=Math.min(stat.size,4*1024*1024);
                const fd=fs.openSync(file,'r'); const buf=Buffer.alloc(size); fs.readSync(fd,buf,0,size,stat.size-size); fs.closeSync(fd);
                const lines=buf.toString('utf8').split(/\r?\n/u); const signals=[];
                for (const line of lines) {
                  let row; try {row=JSON.parse(line);} catch {continue;}
                  const stamp=String(row.timestamp||'');
                  if (stamp<'2026-10-30T08:16:00' || stamp>'2026-10-30T09:19:00') continue;
                  const message=String(row.message||'');
                  const categories=[];
                  if (/transaction/iu.test(message)) categories.push('transaction');
                  if (/deadlock|lock request|LCK_M|ETIMEOUT|request timeout/iu.test(message)) categories.push('lock-or-timeout');
                  if (/connection.*(?:closed|lost|reset)|ECONNRESET/iu.test(message)) categories.push('connection-ended');
                  const match=/\b(GET|PUT|POST|DELETE|PATCH)\s+(\/api\/v1\/cems-wpms-requests(?:\/\d+)?(?:\/[a-z-]+)?)(?:[?\s]|$)/u.exec(message);
                  if (categories.length || match) signals.push({timestamp:stamp,level:row.level,
                    categories,...(match?{method:match[1],path:match[2]}:{}),
                    ...(Number.isSafeInteger(Number(row.requestId))?{requestId:Number(row.requestId)}:{})});
                }
                evidence.push({name,bytes:stat.size,tailBytes:size,truncated:stat.size>size,signals:signals.slice(-50)});
              }
              output('application-log-signals',evidence);
            } else output('application-log-signals',{logDirectoryPresent:false});
           } finally {clearTimeout(guard);await db.destroy();}
          })().catch(error=>{output('failure',{code:error.code||error.name,number:error.number||error.originalError?.info?.number||null});process.exitCode=1;});
          '@ | node
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
