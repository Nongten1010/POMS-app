name: Inspect production checkout

on:
  workflow_dispatch:
    inputs:
      factory_registration_no:
        description: Reference only; inspect session 87 without changing database data
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: poms-prod-readonly-address-audit
  cancel-in-progress: false

jobs:
  inspect:
    if: github.ref == 'refs/heads/backend/verify-factory-address-production'
    runs-on: [self-hosted, poms, windows, prod]
    timeout-minutes: 5
    defaults:
      run:
        shell: powershell
    steps:
      - name: Inspect session 87 transaction and affected resources without changing data
        run: |
          $ErrorActionPreference = 'Stop'
          $OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          Set-Location 'C:\apps\POMS-app\backend'
          $service = Get-CimInstance Win32_Service -Filter "Name='poms-app-backend'" | Select-Object Name, ProcessId, State
          $nodes = @(Get-CimInstance Win32_Process -Filter "Name='node.exe'" | Select-Object ProcessId, ParentProcessId, CreationDate)
          Write-Host ('[session87-readonly-process] ' + (@{ service=$service; nodes=$nodes } | ConvertTo-Json -Compress -Depth 4))
          @'
          const { env } = require('./dist/config/env');
          const knex = require('knex');
          const db = knex({ client: 'mssql', acquireConnectionTimeout: 10000,
            connection: { server: env.DB_HOST, port: env.DB_PORT, user: env.DB_USER,
              password: env.DB_PASSWORD, database: env.DB_NAME, connectionTimeout: 10000,
              requestTimeout: 15000, options: { encrypt: env.DB_ENCRYPT,
                trustServerCertificate: env.DB_TRUST_SERVER_CERTIFICATE } },
            pool: { min: 0, max: 1 },
          });
          const sessionId = 87;
          const output = (stage, value) => console.log('[session87-readonly-' + stage + '] ' + JSON.stringify(value));
          const guard = setTimeout(() => { output('failure', { code: 'TIME_LIMIT' }); process.exit(1); }, 150000);
          guard.unref();
          function statementSummary(text) {
            const original = String(text || '');
            let sql = original;
            const wrapped = /sp_executesql\s+N?'((?:''|[^'])*)'/iu.exec(sql);
            if (wrapped) sql = wrapped[1].replace(/''/gu, "'");
            const noComments = sql.replace(/\/\*[\s\S]*?\*\//gu, ' ').replace(/--[^\r\n]*/gu, ' ');
            const withoutLiterals = noComments.replace(/N?'(?:''|[^'])*'/giu, "'<REDACTED>'")
              .replace(/0x[\da-f]+/giu, '<BINARY>');
            const operations = [...new Set((withoutLiterals.match(/\b(?:DELETE|UPDATE|INSERT|SELECT|MERGE|COMMIT|ROLLBACK)\b/giu) || []).map(x => x.toUpperCase()))];
            const tables = [...new Set([...withoutLiterals.matchAll(/\b(?:from|join|update|into)\s+((?:\[?[a-z_][\w]*\]?\.)?\[?[a-z_][\w]*\]?)/giu)].map(x => x[1]))];
            const predicates = [...noComments.matchAll(/\[?(id|request_id|eligible_factory_id|source_request_id|source_measurement_point_id|factory_registration_no|factory_id)\]?\s*=\s*(@[\w]+|N?'\d+'|\d+)/giu)]
              .map(x => ({ column: x[1], value: x[2] }));
            const bindings = [];
            for (const predicate of predicates) {
              if (!predicate.value.startsWith('@')) continue;
              const name = predicate.value.replace(/[.*+?^${}()|[\]\\]/gu, '\\$&');
              const value = new RegExp(name + "\\s*=\\s*N?'?(\\d+)'?(?=\\s*(?:,|;|$))", 'iu').exec(original)?.[1];
              if (value) bindings.push({ column: predicate.column, parameter: predicate.value, value });
            }
            return { operations, tables, predicates, numericIdentityBindings: bindings,
              queryShape: withoutLiterals.replace(/\b\d+(?:\.\d+)?\b/gu, '?').replace(/\s+/gu, ' ').slice(0, 2200) };
          }
          async function query(stage, sql, bindings = []) {
            try { const rows = await db.raw(sql, bindings).timeout(15000); output(stage, rows); return rows; }
            catch (error) { output(stage, { error: error.code || error.name, number: error.number || error.originalError?.info?.number || null }); return null; }
          }
          function safeError(value, location = 'error', depth = 0) {
           if (!value || depth>3) return null;
           if (typeof value==='string') value={message:value};
           if(typeof value!=='object')return null;
           const result={location,keys:Object.keys(value)};
           for(const key of ['name','code','number','state','class','lineNumber']) {
             const item=value[key];
             if(typeof item==='number' || (typeof item==='string' && /^[A-Za-z_0-9-]{1,64}$/u.test(item)))result[key]=item;
           }
           const text=String(value.message||value.sql||value.query||'');
           const http=/\b(GET|PUT|POST|DELETE|PATCH)\s+(\/api\/v1\/cems-wpms-requests(?:\/\d+)?(?:\/[a-z-]+)?)(?=[?\]\s]|$)/u.exec(text);
           if(http)result.http={method:http[1],path:http[2]};
           const known=[
             ["Can't rollback transaction. There is a request in progress",'ROLLBACK_REJECTED_REQUEST_IN_PROGRESS'],
             ['Transaction query already complete','TRANSACTION_ALREADY_COMPLETE'],
             ['Transaction has been aborted','TRANSACTION_ABORTED'],
             ['The current transaction cannot be committed','TRANSACTION_UNCOMMITTABLE'],
             ['The DELETE statement conflicted','DELETE_CONSTRAINT_CONFLICT'],
             ['The UPDATE statement conflicted','UPDATE_CONSTRAINT_CONFLICT'],
             ['Cannot insert duplicate key','DUPLICATE_KEY'],
             ['String or binary data would be truncated','VALUE_TRUNCATION'],
             ['Request failed to complete','REQUEST_TIMEOUT'],
             ['cancelled','REQUEST_CANCELLED'],
             ['canceled','REQUEST_CANCELLED'],
           ];
           result.signatures=known.filter(([needle])=>text.includes(needle)).map(([,name])=>name);
           const summary=statementSummary(text);
           result.statement={operations:summary.operations,tables:summary.tables,predicates:summary.predicates,numericIdentityBindings:summary.numericIdentityBindings};
           if(Array.isArray(value.bindings))for(const predicate of summary.predicates){
             const match=/^@p(\d+)$/iu.exec(predicate.value);if(!match)continue;
             const binding=value.bindings[Number(match[1])];
             if(/^[0-9]{1,20}$/u.test(String(binding)))result.statement.numericIdentityBindings.push({column:predicate.column,parameter:predicate.value,value:String(binding),origin:'error-bindings'});
           }
           for(const key of ['originalError','cause','info','parent','errors','precedingErrors']) {
             const nested=value[key];if(!nested)continue;
             result[key]=Array.isArray(nested)?nested.slice(0,5).map((x,i)=>safeError(x,location+'.'+key+'.'+i,depth+1)):safeError(nested,location+'.'+key,depth+1);
           }
           return result;
          }
          (async()=>{
           try{
             const fs=require('fs');const path=require('path');
             for(const name of ['app-2026-10-30.log','error-2026-10-30.log']){
               const file=path.resolve('logs',name);if(!fs.existsSync(file))continue;
               const stat=fs.statSync(file);if(stat.size>5*1024*1024){output('safe-error-detail',{name,skipped:'FILE_OVER_5MB'});continue;}
               for(const line of fs.readFileSync(file,'utf8').split(/\r?\n/u)){
                 let row;try{row=JSON.parse(line);}catch{continue;}
                 if(row.timestamp!=='2026-10-30T08:17:00.060Z')continue;
                 output('safe-error-detail',{name,timestamp:row.timestamp,error:safeError(row)});
               }
             }
           }finally{clearTimeout(guard);await db.destroy();}
          })().catch(error=>{output('failure',{code:error.code||error.name});process.exitCode=1;});
          '@ | node
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
