name: Inspect production checkout

on:
  workflow_dispatch:
    inputs:
      factory_registration_no:
        description: Reference only; inspect session 87 without changing database data
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: poms-prod-readonly-address-audit
  cancel-in-progress: false

jobs:
  inspect:
    if: github.ref == 'refs/heads/backend/verify-factory-address-production'
    runs-on: [self-hosted, poms, windows, prod]
    timeout-minutes: 5
    defaults:
      run:
        shell: powershell
    steps:
      - name: Inspect session 87 transaction and affected resources without changing data
        run: |
          $ErrorActionPreference = 'Stop'
          $OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          Set-Location 'C:\apps\POMS-app\backend'
          $service = Get-CimInstance Win32_Service -Filter "Name='poms-app-backend'" | Select-Object Name, ProcessId, State
          $nodes = @(Get-CimInstance Win32_Process -Filter "Name='node.exe'" | Select-Object ProcessId, ParentProcessId, CreationDate)
          Write-Host ('[session87-readonly-process] ' + (@{ service=$service; nodes=$nodes } | ConvertTo-Json -Compress -Depth 4))
          @'
          const { env } = require('./dist/config/env');
          const knex = require('knex');
          const db = knex({ client: 'mssql', acquireConnectionTimeout: 10000,
            connection: { server: env.DB_HOST, port: env.DB_PORT, user: env.DB_USER,
              password: env.DB_PASSWORD, database: env.DB_NAME, connectionTimeout: 10000,
              requestTimeout: 15000, options: { encrypt: env.DB_ENCRYPT,
                trustServerCertificate: env.DB_TRUST_SERVER_CERTIFICATE } },
            pool: { min: 0, max: 1 },
          });
          const sessionId = 87;
          const output = (stage, value) => console.log('[session87-readonly-' + stage + '] ' + JSON.stringify(value));
          const guard = setTimeout(() => { output('failure', { code: 'TIME_LIMIT' }); process.exit(1); }, 150000);
          guard.unref();
          function statementSummary(text) {
            const original = String(text || '');
            let sql = original;
            const wrapped = /sp_executesql\s+N?'((?:''|[^'])*)'/iu.exec(sql);
            if (wrapped) sql = wrapped[1].replace(/''/gu, "'");
            const noComments = sql.replace(/\/\*[\s\S]*?\*\//gu, ' ').replace(/--[^\r\n]*/gu, ' ');
            const withoutLiterals = noComments.replace(/N?'(?:''|[^'])*'/giu, "'<REDACTED>'")
              .replace(/0x[\da-f]+/giu, '<BINARY>');
            const operations = [...new Set((withoutLiterals.match(/\b(?:DELETE|UPDATE|INSERT|SELECT|MERGE|COMMIT|ROLLBACK)\b/giu) || []).map(x => x.toUpperCase()))];
            const tables = [...new Set([...withoutLiterals.matchAll(/\b(?:from|join|update|into)\s+((?:\[?[a-z_][\w]*\]?\.)?\[?[a-z_][\w]*\]?)/giu)].map(x => x[1]))];
            const predicates = [...noComments.matchAll(/\[?(id|request_id|eligible_factory_id|source_request_id|source_measurement_point_id|factory_registration_no|factory_id)\]?\s*=\s*(@[\w]+|N?'\d+'|\d+)/giu)]
              .map(x => ({ column: x[1], value: x[2] }));
            const bindings = [];
            for (const predicate of predicates) {
              if (!predicate.value.startsWith('@')) continue;
              const name = predicate.value.replace(/[.*+?^${}()|[\]\\]/gu, '\\$&');
              const value = new RegExp(name + "\\s*=\\s*N?'?(\\d+)'?(?=\\s*(?:,|;|$))", 'iu').exec(original)?.[1];
              if (value) bindings.push({ column: predicate.column, parameter: predicate.value, value });
            }
            return { operations, tables, predicates, numericIdentityBindings: bindings,
              queryShape: withoutLiterals.replace(/\b\d+(?:\.\d+)?\b/gu, '?').replace(/\s+/gu, ' ').slice(0, 2200) };
          }
          async function query(stage, sql, bindings = []) {
            try { const rows = await db.raw(sql, bindings).timeout(15000); output(stage, rows); return rows; }
            catch (error) { output(stage, { error: error.code || error.name, number: error.number || error.originalError?.info?.number || null }); return null; }
          }
          (async () => {
           try {
            await query('history-clock', `SELECT CONVERT(VARCHAR(33), SYSDATETIME(), 126) AS server_time,
              CONVERT(VARCHAR(33), SYSUTCDATETIME(), 126) AS server_utc`);
            const fs=require('fs');const path=require('path');
            const root=path.resolve('logs');
            for (const name of ['app-2026-10-30.log','error-2026-10-30.log']) {
              const file=path.join(root,name);if(!fs.existsSync(file))continue;
              const stat=fs.statSync(file);if(stat.size>5*1024*1024){output('target-error',{name,skipped:'FILE_OVER_5MB'});continue;}
              for (const line of fs.readFileSync(file,'utf8').split(/\r?\n/u)) {
                let row;try{row=JSON.parse(line);}catch{continue;}
                if(row.timestamp!=='2026-10-30T08:17:00.060Z')continue;
                const message=String(row.message||'');
                const recognized=[];
                for (const pattern of [
                  /(?:The )?(?:DELETE|UPDATE|INSERT) statement conflicted with (?:the )?(?:REFERENCE|FOREIGN KEY|CHECK|UNIQUE)[^.]*\./giu,
                  /The current transaction cannot be committed and cannot support operations that write to the log file/giu,
                  /Transaction count after EXECUTE indicates a mismatching number of BEGIN and COMMIT statements[^.]*\./giu,
                  /Transaction query already complete/giu,
                  /Transaction has been aborted/giu,
                  /The ROLLBACK TRANSACTION request has no corresponding BEGIN TRANSACTION/giu,
                  /Cannot insert duplicate key[^.]*\./giu,
                  /String or binary data would be truncated[^.]*\./giu,
                ]) for(const match of message.matchAll(pattern)) recognized.push(match[0].replace(/N?'(?:''|[^'])*'/giu,"'<REDACTED>'"));
                const summary=statementSummary(message);
                const stack=String(row.stack||'').split(/\r?\n/u).filter(x=>/^\s*at /u.test(x)).slice(0,10);
                output('target-error',{name,timestamp:row.timestamp,level:row.level,keys:Object.keys(row),
                  code:typeof row.code==='string'?row.code:null,number:typeof row.number==='number'?row.number:null,
                  recognized,statement:{operations:summary.operations,tables:summary.tables,predicates:summary.predicates,numericIdentityBindings:summary.numericIdentityBindings},stack});
              }
            }
            try{
              const rows=await db.raw(`SELECT TOP(30) q.query_id, p.plan_id, qt.query_sql_text,
                MIN(rs.first_execution_time) AS first_execution_time, MAX(rs.last_execution_time) AS last_execution_time,
                SUM(rs.count_executions) AS count_executions, MAX(rs.last_rowcount) AS last_rowcount
                FROM sys.query_store_query q JOIN sys.query_store_query_text qt ON qt.query_text_id=q.query_text_id
                JOIN sys.query_store_plan p ON p.query_id=q.query_id
                JOIN sys.query_store_runtime_stats rs ON rs.plan_id=p.plan_id
                WHERE rs.last_execution_time>=CONVERT(DATETIMEOFFSET, ?) AND rs.first_execution_time<=CONVERT(DATETIMEOFFSET, ?)
                AND (qt.query_sql_text LIKE '%cems_wpms_connection_requests%' OR qt.query_sql_text LIKE '%cems_wpms_request_factory_snapshots%')
                AND (qt.query_sql_text LIKE '%delete %' OR qt.query_sql_text LIKE '%update %' OR qt.query_sql_text LIKE '%insert %')
                GROUP BY q.query_id,p.plan_id,qt.query_sql_text ORDER BY MAX(rs.last_execution_time) DESC`,
                ['2026-10-30T15:16:00+07:00','2026-10-30T16:18:00+07:00']).timeout(15000);
              output('query-store-candidates',rows.map(row=>({query_id:row.query_id,plan_id:row.plan_id,
                first_execution_time:row.first_execution_time,last_execution_time:row.last_execution_time,
                count_executions:row.count_executions,last_rowcount:row.last_rowcount,summary:statementSummary(row.query_sql_text)})));
            }catch(error){output('query-store-candidates',{error:error.code||error.name,number:error.number||error.originalError?.info?.number||null});}
            await query('audit-capabilities', `SELECT name, is_tracked_by_cdc, temporal_type_desc FROM sys.tables
              WHERE name IN ('cems_wpms_connection_requests','cems_wpms_request_factory_snapshots');`);
            await query('configured-database-audits', `SELECT name,is_state_enabled FROM sys.database_audit_specifications`);
            await query('log-summary', `SELECT recovery_model,total_log_size_mb,active_log_size_mb,log_min_lsn,log_end_lsn,
              log_truncation_holdup_reason FROM sys.dm_db_log_stats(DB_ID())`);
           }finally{clearTimeout(guard);await db.destroy();}
          })().catch(error=>{output('failure',{code:error.code||error.name,number:error.number||error.originalError?.info?.number||null});process.exitCode=1;});
          '@ | node
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
