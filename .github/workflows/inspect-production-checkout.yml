name: Inspect production checkout

on:
  workflow_dispatch:
    inputs:
      factory_registration_no:
        description: Reference only; inspect session 87 without changing database data
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: poms-prod-readonly-address-audit
  cancel-in-progress: false

jobs:
  inspect:
    if: github.ref == 'refs/heads/backend/verify-factory-address-production'
    runs-on: [self-hosted, poms, windows, prod]
    timeout-minutes: 5
    defaults:
      run:
        shell: powershell
    steps:
      - name: Inspect session 87 transaction and affected resources without changing data
        run: |
          $ErrorActionPreference = 'Stop'
          $OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          Set-Location 'C:\apps\POMS-app\backend'
          $service = Get-CimInstance Win32_Service -Filter "Name='poms-app-backend'" | Select-Object Name, ProcessId, State
          $nodes = @(Get-CimInstance Win32_Process -Filter "Name='node.exe'" | Select-Object ProcessId, ParentProcessId, CreationDate)
          Write-Host ('[session87-readonly-process] ' + (@{ service=$service; nodes=$nodes } | ConvertTo-Json -Compress -Depth 4))
          @'
          const { env } = require('./dist/config/env');
          const knex = require('knex');
          const db = knex({ client: 'mssql', acquireConnectionTimeout: 10000,
            connection: { server: env.DB_HOST, port: env.DB_PORT, user: env.DB_USER,
              password: env.DB_PASSWORD, database: env.DB_NAME, connectionTimeout: 10000,
              requestTimeout: 15000, options: { encrypt: env.DB_ENCRYPT,
                trustServerCertificate: env.DB_TRUST_SERVER_CERTIFICATE } },
            pool: { min: 0, max: 1 },
          });
          const sessionId = 87;
          const output = (stage, value) => console.log('[session87-readonly-' + stage + '] ' + JSON.stringify(value));
          const guard = setTimeout(() => { output('failure', { code: 'TIME_LIMIT' }); process.exit(1); }, 150000);
          guard.unref();
          function statementSummary(text) {
            const original = String(text || '');
            let sql = original;
            const wrapped = /sp_executesql\s+N?'((?:''|[^'])*)'/iu.exec(sql);
            if (wrapped) sql = wrapped[1].replace(/''/gu, "'");
            const noComments = sql.replace(/\/\*[\s\S]*?\*\//gu, ' ').replace(/--[^\r\n]*/gu, ' ');
            const withoutLiterals = noComments.replace(/N?'(?:''|[^'])*'/giu, "'<REDACTED>'")
              .replace(/0x[\da-f]+/giu, '<BINARY>');
            const operations = [...new Set((withoutLiterals.match(/\b(?:DELETE|UPDATE|INSERT|SELECT|MERGE|COMMIT|ROLLBACK)\b/giu) || []).map(x => x.toUpperCase()))];
            const tables = [...new Set([...withoutLiterals.matchAll(/\b(?:from|join|update|into)\s+((?:\[?[a-z_][\w]*\]?\.)?\[?[a-z_][\w]*\]?)/giu)].map(x => x[1]))];
            const predicates = [...noComments.matchAll(/\[?(id|request_id|eligible_factory_id|source_request_id|source_measurement_point_id|factory_registration_no|factory_id)\]?\s*=\s*(@[\w]+|N?'\d+'|\d+)/giu)]
              .map(x => ({ column: x[1], value: x[2] }));
            const bindings = [];
            for (const predicate of predicates) {
              if (!predicate.value.startsWith('@')) continue;
              const name = predicate.value.replace(/[.*+?^${}()|[\]\\]/gu, '\\$&');
              const value = new RegExp(name + "\\s*=\\s*N?'?(\\d+)'?(?=\\s*(?:,|;|$))", 'iu').exec(original)?.[1];
              if (value) bindings.push({ column: predicate.column, parameter: predicate.value, value });
            }
            return { operations, tables, predicates, numericIdentityBindings: bindings,
              queryShape: withoutLiterals.replace(/\b\d+(?:\.\d+)?\b/gu, '?').replace(/\s+/gu, ' ').slice(0, 2200) };
          }
          async function query(stage, sql, bindings = []) {
            try { const rows = await db.raw(sql, bindings).timeout(15000); output(stage, rows); return rows; }
            catch (error) { output(stage, { error: error.code || error.name, number: error.number || error.originalError?.info?.number || null }); return null; }
          }
          (async () => {
           try {
            await query('clock', `SELECT CONVERT(VARCHAR(33), SYSDATETIME(), 126) AS server_time,
              CONVERT(VARCHAR(33), SYSUTCDATETIME(), 126) AS server_utc,
              CONVERT(VARCHAR(32), SERVERPROPERTY('ProductVersion')) AS sql_version, @@SPID AS audit_session_id`);
            const sessions = await query('identity', `SELECT s.session_id, s.status, s.program_name, s.host_process_id,
              s.open_transaction_count, s.transaction_isolation_level,
              CONVERT(VARCHAR(33), s.login_time, 126) AS login_time,
              CONVERT(VARCHAR(33), s.last_request_start_time, 126) AS last_request_start_time,
              CONVERT(VARCHAR(33), s.last_request_end_time, 126) AS last_request_end_time,
              CONVERT(VARCHAR(33), c.connect_time, 126) AS connect_time
              FROM sys.dm_exec_sessions s LEFT JOIN sys.dm_exec_connections c ON c.session_id=s.session_id
              WHERE s.session_id=?`, [sessionId]);
            if (!sessions?.length) { output('conclusion', { sessionExists: false }); return; }
            await query('transactions', `SELECT st.session_id, CONVERT(VARCHAR(32), st.transaction_id) AS transaction_id,
              st.is_user_transaction, st.is_local, st.enlist_count, t.name AS transaction_name,
              CONVERT(VARCHAR(33), t.transaction_begin_time, 126) AS transaction_begin_time,
              t.transaction_type, t.transaction_state, dt.database_id,
              CASE WHEN dt.database_id=DB_ID() THEN 1 ELSE 0 END AS current_database,
              dt.database_transaction_state, dt.database_transaction_log_record_count,
              dt.database_transaction_log_bytes_used, dt.database_transaction_log_bytes_reserved,
              CONVERT(VARCHAR(64), dt.database_transaction_begin_lsn) AS database_transaction_begin_lsn
              FROM sys.dm_tran_session_transactions st
              LEFT JOIN sys.dm_tran_active_transactions t ON t.transaction_id=st.transaction_id
              LEFT JOIN sys.dm_tran_database_transactions dt ON dt.transaction_id=st.transaction_id
              WHERE st.session_id=?`, [sessionId]);
            for (const [stage, sql] of [
              ['input', `SELECT event_type, parameters, event_info FROM sys.dm_exec_input_buffer(?, NULL)`],
              ['recent', `SELECT text AS event_info FROM sys.dm_exec_connections c
                CROSS APPLY sys.dm_exec_sql_text(c.most_recent_sql_handle) txt WHERE c.session_id=?`],
            ]) {
              try {
                const rows = await db.raw(sql, [sessionId]).timeout(10000);
                output(stage, rows.map(row => ({ event_type: row.event_type || null, parameters: row.parameters ?? null,
                  summary: statementSummary(row.event_info) })));
              } catch (error) { output(stage, { error: error.code || error.name }); }
            }
            const locks = await query('locks', `SELECT l.resource_type, l.resource_database_id,
              CONVERT(VARCHAR(64), l.resource_associated_entity_id) AS resource_associated_entity_id,
              l.resource_description, l.request_mode, l.request_status, l.request_owner_type,
              CONVERT(VARCHAR(64), l.request_owner_id) AS request_owner_id,
              SCHEMA_NAME(o.schema_id) AS schema_name, o.name AS object_name, i.name AS index_name,
              i.index_id, p.partition_number
              FROM sys.dm_tran_locks l
              LEFT JOIN sys.partitions p ON l.resource_database_id=DB_ID() AND p.hobt_id=l.resource_associated_entity_id
              LEFT JOIN sys.objects o ON l.resource_database_id=DB_ID() AND o.object_id=
                CASE WHEN l.resource_type='OBJECT' THEN l.resource_associated_entity_id ELSE p.object_id END
              LEFT JOIN sys.indexes i ON i.object_id=p.object_id AND i.index_id=p.index_id
              WHERE l.request_session_id=? ORDER BY object_name, l.resource_type, l.resource_description`, [sessionId]);
            await query('blocked', `SELECT session_id, status, command, blocking_session_id, wait_type, wait_time,
              wait_resource, open_transaction_count FROM sys.dm_exec_requests
              WHERE blocking_session_id=? OR session_id=?`, [sessionId, sessionId]);
            const tables = [...new Set((locks || []).map(x => x.object_name).filter(Boolean))];
            if (tables.length) {
              const fk = await db('sys.foreign_keys AS fk')
                .join('sys.tables AS child', 'child.object_id', 'fk.parent_object_id')
                .join('sys.tables AS parent', 'parent.object_id', 'fk.referenced_object_id')
                .where(builder => builder.whereIn('child.name', tables).orWhereIn('parent.name', tables))
                .select('fk.name', 'child.name AS child_table', 'parent.name AS parent_table',
                  'fk.delete_referential_action_desc', 'fk.update_referential_action_desc', 'fk.is_disabled').timeout(10000);
              output('foreign-keys', fk);
              const columns = await db('INFORMATION_SCHEMA.COLUMNS').where('TABLE_SCHEMA', 'dbo').whereIn('TABLE_NAME', tables)
                .select('TABLE_NAME','COLUMN_NAME','DATA_TYPE').timeout(10000);
              output('identity-columns', columns.filter(x => /(^id$|_id$|registration|request_no|request_number|factory_name|status|deleted_at|created_at|updated_at|district|subdistrict)/iu.test(x.COLUMN_NAME)));
            }
            await query('identity-end', `SELECT s.session_id, s.host_process_id, s.open_transaction_count,
              CONVERT(VARCHAR(33), s.login_time, 126) AS login_time,
              CONVERT(VARCHAR(33), t.transaction_begin_time, 126) AS transaction_begin_time,
              CONVERT(VARCHAR(32), st.transaction_id) AS transaction_id
              FROM sys.dm_exec_sessions s LEFT JOIN sys.dm_tran_session_transactions st ON st.session_id=s.session_id
              LEFT JOIN sys.dm_tran_active_transactions t ON t.transaction_id=st.transaction_id WHERE s.session_id=?`, [sessionId]);
           } finally { clearTimeout(guard); await db.destroy(); }
          })().catch(error => { output('failure', { code: error.code || error.name, number: error.number || error.originalError?.info?.number || null }); process.exitCode=1; });
          '@ | node
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
