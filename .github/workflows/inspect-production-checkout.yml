              if(table==='factory_profiles'||table==='cems_wpms_connected_measurement_points')active=active&&activeEligible.has(String(row.eligible_factory_id));
              if(table==='cems_wpms_request_factory_snapshots')active=active&&activeRequests.has(String(row.request_id));
              if(active)activeRows++;
              for(const field of ['address','factory_address','district_name','subdistrict_name']){
               if(row[field]==null)continue;
               const value=String(row[field]);
               if(!broadArea.test(value)&&!(field.endsWith('_name')&&numericOnly.test(value)))continue;
               issues.push({id:String(row.id),field,active,status:row.status||null,deleted:row.deleted_at!=null});
               if(active)activeIssues++;else historicalIssues++;
              }
             }
             scan.push({table,present:true,optional:optionalTables.includes(table),rows:rows.length,activeRows,historicalRows:rows.length-activeRows,readPast:false,activeNumericIssues:issues.filter(x=>x.active).length,historicalNumericIssues:issues.filter(x=>!x.active).length,issues});
            }
            output('post-global-scan',{complete:true,readMode:'committed; no READPAST/NOLOCK',activeNumericIssues:activeIssues,historicalNumericIssues:historicalIssues,tables:scan});

            const eligible=await db('eligible_factories').where('id',430).first('id','factory_registration_no_new','factory_name','address').timeout(15000);
            const form=await db('factory_monitoring_point_forms').where('id',426).first('id','factory_registration_no_new','factory_name','address').timeout(15000);
            const targetIds=[10345,10346,10376,10377];
            const requests=await db('cems_wpms_connection_requests').whereIn('id',targetIds).select('id','request_no','factory_id','factory_registration_no','factory_name','address','status').timeout(15000);
            output('post-target-database',{eligible,form,requests});
            assert(eligible?.factory_registration_no_new==='82250600225587'&&form?.factory_registration_no_new==='82250600225587','TARGET_REGISTRATION_MISMATCH');
            assert([eligible,form,...requests].length===6&&requests.length===4&&[eligible,form,...requests].every(x=>x&&x.address===expectedAddress),'TARGET_FACTORY_DATABASE_MISMATCH');
            assert([eligible,form,...requests.filter(x=>[10376,10377].includes(Number(x.id)))].every(x=>x.factory_name===expectedFactoryName),'TARGET_CURRENT_FACTORY_NAME_MISMATCH');

            applicationDb=require('./dist/config/database').db;
            factoryLookupDb=require('./dist/config/factory-source-database').factorySourceDb;
            parameterLookupDb=require('./dist/config/parameter-source-database').parameterSourceDb;
            const {connectionRequestsService}=require('./dist/modules/connection-requests/connection-requests.service');
            const {eligibleFactoriesRepository}=require('./dist/modules/eligible-factories/eligible-factories.repository');
            const {normalizeFactoryAreaNamesForWrite}=require('./dist/modules/eligible-factories/factory-area-names');
            for(const mode of ['legacy','canonical']){
             env.FACTORY_PROFILE_MODE=mode;
             const selected=await eligibleFactoriesRepository.findById(430);
             assert(selected?.address===expectedAddress&&selected?.factoryName===expectedFactoryName,'MODE_ELIGIBLE_FACTORY_MISMATCH');
             for(const id of [10376,10377]){
              const result=await connectionRequestsService.getForm(id,1,'ALL');
              const evidence={mode,requestId:id,factoryName:result.factoryName,factoryRegistrationNo:result.factoryRegistrationNo,address:result.address,
               provinceName:result.provinceName,districtName:result.districtName,subdistrictName:result.subdistrictName};
              output('post-target-form-service',evidence);
              assert(result.address===expectedAddress&&result.factoryName===expectedFactoryName,'TARGET_FACTORY_SERVICE_MISMATCH');
             }
             const input={factoryId:'82250600225587',factoryRegistrationNoNew:'82250600225587',address:numericAddress,
              provinceName:'\u0e23\u0e30\u0e22\u0e2d\u0e07',provinceCode:'1021',districtCode:'6',districtName:'6',subdistrictCode:'5',subdistrictName:'5'};
             const normalized=await normalizeFactoryAreaNamesForWrite(input);
             assert(normalized.address===expectedAddress&&normalized.districtName==='\u0e1b\u0e25\u0e27\u0e01\u0e41\u0e14\u0e07'&&normalized.subdistrictName==='\u0e21\u0e32\u0e1a\u0e22\u0e32\u0e07\u0e1e\u0e23','DEPLOYED_WRITE_NORMALIZER_MISMATCH');
             assert(normalized.provinceCode==='1021'&&normalized.districtCode==='6'&&normalized.subdistrictCode==='5','MACHINE_CODES_CHANGED');
             let rejection=null;
             try{await normalizeFactoryAreaNamesForWrite({...input,address:'7/507 \u0e2b\u0e21\u0e39\u0e48 6 \u0e15\u0e33\u0e1a\u0e255 \u0e2d\u0e33\u0e40\u0e20\u0e2d999 \u0e08\u0e31\u0e07\u0e2b\u0e27\u0e31\u0e14\u0e23\u0e30\u0e22\u0e2d\u0e07 21140',districtCode:'999',districtName:'999'});}
             catch(error){rejection={statusCode:error.statusCode,code:error.code,reason:error.details?.reason};}
             assert(rejection?.statusCode===400&&rejection?.code==='BAD_REQUEST'&&rejection?.reason==='UNRESOLVED_ADMINISTRATIVE_AREA','INVALID_AREA_CODE_NOT_REJECTED');
             output('post-deployed-normalizer',{mode,noPersistence:true,normalized:{address:normalized.address,districtName:normalized.districtName,subdistrictName:normalized.subdistrictName,
              provinceCode:normalized.provinceCode,districtCode:normalized.districtCode,subdistrictCode:normalized.subdistrictCode},invalid999:rejection});
            }
            env.FACTORY_PROFILE_MODE=originalMode;
            assert(activeIssues===0&&historicalIssues===0,'NUMERIC_ADMINISTRATIVE_NAMES_REMAIN');
            output('post-result',{passed:true,repairedHistoricalRows:18,activeNumericIssues:0,historicalNumericIssues:0,
             productionMode:originalMode,modesExercisedInAuditProcessOnly:['legacy','canonical'],mutationsPerformed:false});
           }finally{
            env.FACTORY_PROFILE_MODE=originalMode;
            clearTimeout(guard);
            await Promise.allSettled([...new Set([db,applicationDb,factoryLookupDb,parameterLookupDb].filter(Boolean))].map(pool=>pool.destroy()));
           }
          })().catch(error=>{output('failure',{code:error.code||error.name,number:error.number||error.originalError?.info?.number||null});process.exitCode=1;});

          }else{output('failure',{code:'INVALID_AUDIT_PHASE'});process.exitCode=1;}
          '@ | node
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
