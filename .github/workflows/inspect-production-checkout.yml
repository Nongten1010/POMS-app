name: Inspect production checkout

on:
  workflow_dispatch:
    inputs:
      factory_registration_no:
        description: Reference registration; this audit scans all factory address records
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: poms-prod-readonly-address-audit
  cancel-in-progress: false

jobs:
  inspect:
    if: github.ref == 'refs/heads/backend/verify-factory-address-production'
    runs-on: [self-hosted, poms, windows, prod]
    timeout-minutes: 5
    defaults:
      run:
        shell: powershell
    steps:
      - name: Audit administrative area names across all factory records and both profile modes
        run: |
          $ErrorActionPreference = 'Stop'
          $OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          Set-Location 'C:\apps\POMS-app\backend'
          @'
          const { env } = require('./dist/config/env');
          const knex = require('knex');
          const db = knex({ client: 'mssql', acquireConnectionTimeout: 15000,
            connection: { server: env.DB_HOST, port: env.DB_PORT, user: env.DB_USER,
              password: env.DB_PASSWORD, database: env.DB_NAME, connectionTimeout: 10000,
              requestTimeout: 20000, options: { encrypt: env.DB_ENCRYPT,
                trustServerCertificate: env.DB_TRUST_SERVER_CERTIFICATE } },
            pool: { min: 0, max: 1 },
          });
          const guard = setTimeout(() => { console.error('[factory-address-all-audit] TIME_LIMIT'); process.exit(1); }, 180000);
          guard.unref();
          const full = /(?:\u0e15\u0e33\u0e1a\u0e25|\u0e2d\u0e33\u0e40\u0e20\u0e2d)\s*\d+(?:\s|$)/u;
          const broad = /(?:\u0e15\u0e33\u0e1a\u0e25|\u0e2d\u0e33\u0e40\u0e20\u0e2d|\u0e41\u0e02\u0e27\u0e07|\u0e40\u0e02\u0e15|\u0e15\.|\u0e2d\.)\s*[:.\-]?\s*[0-9\u0e50-\u0e59]+/u;
          const numericName = /^\s*[0-9\u0e50-\u0e59]+\s*$/u;
          const configs = [
            ['eligible_factories', 'address'],
            ['factory_profiles', 'address'],
            ['cems_wpms_connected_measurement_points', 'factory_address'],
            ['factory_monitoring_point_forms', 'address'],
            ['current_eligible_factories', 'address'],
            ['current_connected_measurement_points', 'factory_address'],
            ['current_factory_monitoring_point_forms', 'address'],
            ['cems_wpms_connection_requests', 'address'],
            ['cems_wpms_request_factory_snapshots', null],
            ['districts', null],
            ['subdistricts', null],
          ];
          (async () => {
            try {
              try {
                const versioning = await db.raw('SELECT is_read_committed_snapshot_on, snapshot_isolation_state_desc FROM sys.databases WHERE database_id = DB_ID()').timeout(10000);
                console.log('[factory-address-all-audit-diagnostics] ' + JSON.stringify({ versioning }));
                const waits = await db.raw(`SELECT r.session_id, r.blocking_session_id, r.wait_type, r.wait_time, r.wait_resource,
                  r.open_transaction_count, r.command, s.program_name, s.transaction_isolation_level
                  FROM sys.dm_exec_requests r JOIN sys.dm_exec_sessions s ON s.session_id=r.session_id
                  WHERE r.database_id=DB_ID() AND r.session_id<>@@SPID`).timeout(10000);
                console.log('[factory-address-all-audit-diagnostics] ' + JSON.stringify({ waits }));
                const blockers = await db.raw(`SELECT s.session_id, s.status, s.program_name, s.host_process_id,
                  s.open_transaction_count, s.last_request_start_time, s.last_request_end_time,
                  t.transaction_begin_time, t.transaction_state,
                  CASE WHEN ib.event_info LIKE '%UPDATE%' THEN 'UPDATE'
                    WHEN ib.event_info LIKE '%INSERT%' THEN 'INSERT'
                    WHEN ib.event_info LIKE '%DELETE%' THEN 'DELETE'
                    WHEN ib.event_info LIKE '%SELECT%' THEN 'SELECT' ELSE 'OTHER' END AS last_statement_kind
                  FROM sys.dm_exec_sessions s
                  LEFT JOIN sys.dm_tran_session_transactions st ON st.session_id=s.session_id
                  LEFT JOIN sys.dm_tran_active_transactions t ON t.transaction_id=st.transaction_id
                  OUTER APPLY sys.dm_exec_input_buffer(s.session_id, NULL) ib
                  WHERE s.session_id IN (SELECT blocking_session_id FROM sys.dm_exec_requests
                    WHERE database_id=DB_ID() AND blocking_session_id>0)`).timeout(10000);
                console.log('[factory-address-all-audit-diagnostics] ' + JSON.stringify({ blockers }));

              } catch (error) { console.log('[factory-address-all-audit-diagnostics] ' + JSON.stringify({ code: error.code || error.name })); }
              console.log('[factory-address-all-audit-stage] metadata');
              const columns = await db('INFORMATION_SCHEMA.COLUMNS').where('TABLE_SCHEMA', 'dbo')
                .whereIn('TABLE_NAME', configs.map(x => x[0])).select('TABLE_NAME', 'COLUMN_NAME').timeout(20000);
              const byTable = new Map();
              for (const x of columns) {
                if (!byTable.has(x.TABLE_NAME)) byTable.set(x.TABLE_NAME, new Set());
                byTable.get(x.TABLE_NAME).add(x.COLUMN_NAME);
              }
              const records = new Map();
              const tables = [];
              const issues = [];
              const activeEligible = new Set();
              const activeRequests = new Set();
              const candidates = ['id', 'eligible_factory_id', 'request_id', 'factory_id', 'source_factory_id',
                'factory_registration_no_new', 'factory_registration_no_old', 'factory_registration_no',
                'monitoring_point_form_id', 'factory_name', 'deleted_at', 'status', 'revision',
                'address', 'factory_address', 'district_name', 'subdistrict_name', 'name_th'];
              for (const [table, addressField] of configs) {
                const available = byTable.get(table);
                if (!available) { tables.push({ table, missing: true }); continue; }
                const selected = candidates.filter(x => available.has(x));
                console.log('[factory-address-all-audit-stage] reading ' + table);
                let rows;
                const readPast = ['cems_wpms_connection_requests', 'cems_wpms_request_factory_snapshots'].includes(table);
                try { rows = await (readPast ? db.fromRaw('?? WITH (READPAST)', [table]) : db(table))
                  .select(selected).timeout(15000); }
                catch (error) {
                  tables.push({ table, incomplete: true, code: error.code || error.name });
                  console.log('[factory-address-all-audit-table] ' + JSON.stringify(tables[tables.length - 1]));
                  continue;
                }
                console.log('[factory-address-all-audit-stage] read ' + table + ': ' + rows.length);
                records.set(table, new Map(rows.map(x => [String(x.id), x])));
                if (table === 'eligible_factories') for (const row of rows) {
                  if (row.deleted_at == null) activeEligible.add(String(row.id));
                }
                if (table === 'cems_wpms_connection_requests') for (const row of rows) {
                  if (row.deleted_at == null && !['CANCELED', 'REJECTED'].includes(row.status)) activeRequests.add(String(row.id));
                }
                let activeRows = 0, activeIssues = 0, historicalIssues = 0, exactPatternIssues = 0;
                for (const row of rows) {
                  let active = row.deleted_at == null;
                  if (table === 'factory_profiles') active = active && activeEligible.has(String(row.eligible_factory_id));
                  if (table === 'cems_wpms_connection_requests') active = active && activeRequests.has(String(row.id));
                  if (table === 'cems_wpms_request_factory_snapshots') active = active && activeRequests.has(String(row.request_id));
                  if (active) activeRows++;
                  for (const field of selected) {
                    const isName = ['district_name', 'subdistrict_name'].includes(field)
                      || (['districts', 'subdistricts'].includes(table) && field === 'name_th');
                    if (field !== addressField && !isName) continue;
                    const value = row[field];
                    if (value == null) continue;
                    const text = String(value);
                    if (!(isName ? numericName.test(text) || broad.test(text) : broad.test(text))) continue;
                    const exact = !isName && full.test(text);
                    if (exact) exactPatternIssues++;
                    if (active) activeIssues++; else historicalIssues++;
                    issues.push({ table, id: row.id, field, active, exactPattern: exact,
                      registration: row.factory_registration_no_new || row.source_factory_id || row.factory_id || row.factory_registration_no || null,
                      eligibleFactoryId: row.eligible_factory_id || (table === 'eligible_factories' ? row.id : null),
                      value: text, status: row.status || null,
                    });
                  }
                }
                let expectedRows = rows.length;
                if (readPast) {
                  const estimate = await db.raw('SELECT SUM(row_count) AS total FROM sys.dm_db_partition_stats WHERE object_id=OBJECT_ID(?) AND index_id IN (0,1)', [table]).timeout(10000);
                  expectedRows = Number(estimate[0].total);
                }
                tables.push({ table, rows: rows.length, expectedRows, skippedLockedRows: Math.max(0, expectedRows - rows.length), readPast,
                  activeRows, activeIssues, historicalIssues, exactPatternIssues });
                console.log('[factory-address-all-audit-table] ' + JSON.stringify(tables[tables.length - 1]));
              }
              const backups = await db('factory_address_names_repair_backup_0149')
                .select('target_table', 'entity_id').timeout(20000);
              const backupSummary = {};
              const repairedFactories = new Map();
              const eligible = records.get('eligible_factories');
              const byForm = new Map([...eligible.values()].filter(x => x.monitoring_point_form_id != null)
                .map(x => [String(x.monitoring_point_form_id), x]));
              for (const backup of backups) {
                backupSummary[backup.target_table] = (backupSummary[backup.target_table] || 0) + 1;
                const row = records.get(backup.target_table)?.get(String(backup.entity_id));
                const factory = backup.target_table === 'eligible_factories' ? row
                  : backup.target_table === 'factory_monitoring_point_forms' ? byForm.get(String(backup.entity_id))
                  : row?.eligible_factory_id != null ? eligible.get(String(row.eligible_factory_id)) : null;
                if (factory) repairedFactories.set(String(factory.id), {
                  id: factory.id, registration: factory.factory_registration_no_new,
                  factoryName: factory.factory_name, address: factory.address,
                });
              }
              const report = { mode: env.FACTORY_PROFILE_MODE, complete: !tables.some(x => x.missing || x.incomplete || x.skippedLockedRows > 0), tables, issues,
                backupSummary, repairedFactories: [...repairedFactories.values()],
                activeIssues: issues.filter(x => x.active).length,
                historicalIssues: issues.filter(x => !x.active).length,
                modeCoverage: { legacy: tables.filter(x => !x.table.startsWith('current_') && !x.missing).map(x => x.table),
                  canonical: tables.filter(x => (x.table.startsWith('current_') || x.table === 'factory_profiles') && !x.missing).map(x => x.table) },
              };
              console.log('[factory-address-all-audit] ' + JSON.stringify(report));
            } finally { clearTimeout(guard); await db.destroy(); }
          })().catch(error => {
            console.error('[factory-address-all-audit] FAILED ' + JSON.stringify({ code: error.code || error.name }));
            process.exitCode = 1;
          });
          '@ | node
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
