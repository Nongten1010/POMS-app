name: Inspect production checkout

on:
  workflow_dispatch:
    inputs:
      factory_registration_no:
        description: Reference only; inspect session 87 without changing database data
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: poms-prod-readonly-address-audit
  cancel-in-progress: false

jobs:
  inspect:
    if: github.ref == 'refs/heads/backend/verify-factory-address-production'
    runs-on: [self-hosted, poms, windows, prod]
    timeout-minutes: 5
    defaults:
      run:
        shell: powershell
    steps:
      - name: Inspect session 87 transaction and affected resources without changing data
        run: |
          $ErrorActionPreference = 'Stop'
          $OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          Set-Location 'C:\apps\POMS-app\backend'
          $service = Get-CimInstance Win32_Service -Filter "Name='poms-app-backend'" | Select-Object Name, ProcessId, State
          $nodes = @(Get-CimInstance Win32_Process -Filter "Name='node.exe'" | Select-Object ProcessId, ParentProcessId, CreationDate)
          Write-Host ('[session87-readonly-process] ' + (@{ service=$service; nodes=$nodes } | ConvertTo-Json -Compress -Depth 4))
          @'
          const { env } = require('./dist/config/env');
          const knex = require('knex');
          const db = knex({ client: 'mssql', acquireConnectionTimeout: 10000,
            connection: { server: env.DB_HOST, port: env.DB_PORT, user: env.DB_USER,
              password: env.DB_PASSWORD, database: env.DB_NAME, connectionTimeout: 10000,
              requestTimeout: 15000, options: { encrypt: env.DB_ENCRYPT,
                trustServerCertificate: env.DB_TRUST_SERVER_CERTIFICATE } },
            pool: { min: 0, max: 1 },
          });
          const sessionId = 87;
          const output = (stage, value) => console.log('[session87-readonly-' + stage + '] ' + JSON.stringify(value));
          const guard = setTimeout(() => { output('failure', { code: 'TIME_LIMIT' }); process.exit(1); }, 150000);
          guard.unref();
          function statementSummary(text) {
            const original = String(text || '');
            let sql = original;
            const wrapped = /sp_executesql\s+N?'((?:''|[^'])*)'/iu.exec(sql);
            if (wrapped) sql = wrapped[1].replace(/''/gu, "'");
            const noComments = sql.replace(/\/\*[\s\S]*?\*\//gu, ' ').replace(/--[^\r\n]*/gu, ' ');
            const withoutLiterals = noComments.replace(/N?'(?:''|[^'])*'/giu, "'<REDACTED>'")
              .replace(/0x[\da-f]+/giu, '<BINARY>');
            const operations = [...new Set((withoutLiterals.match(/\b(?:DELETE|UPDATE|INSERT|SELECT|MERGE|COMMIT|ROLLBACK)\b/giu) || []).map(x => x.toUpperCase()))];
            const tables = [...new Set([...withoutLiterals.matchAll(/\b(?:from|join|update|into)\s+((?:\[?[a-z_][\w]*\]?\.)?\[?[a-z_][\w]*\]?)/giu)].map(x => x[1]))];
            const predicates = [...noComments.matchAll(/\[?(id|request_id|eligible_factory_id|source_request_id|source_measurement_point_id|factory_registration_no|factory_id)\]?\s*=\s*(@[\w]+|N?'\d+'|\d+)/giu)]
              .map(x => ({ column: x[1], value: x[2] }));
            const bindings = [];
            for (const predicate of predicates) {
              if (!predicate.value.startsWith('@')) continue;
              const name = predicate.value.replace(/[.*+?^${}()|[\]\\]/gu, '\\$&');
              const value = new RegExp(name + "\\s*=\\s*N?'?(\\d+)'?(?=\\s*(?:,|;|$))", 'iu').exec(original)?.[1];
              if (value) bindings.push({ column: predicate.column, parameter: predicate.value, value });
            }
            return { operations, tables, predicates, numericIdentityBindings: bindings,
              queryShape: withoutLiterals.replace(/\b\d+(?:\.\d+)?\b/gu, '?').replace(/\s+/gu, ' ').slice(0, 2200) };
          }
          async function query(stage, sql, bindings = []) {
            try { const rows = await db.raw(sql, bindings).timeout(15000); output(stage, rows); return rows; }
            catch (error) { output(stage, { error: error.code || error.name, number: error.number || error.originalError?.info?.number || null }); return null; }
          }
          const {createHash}=require('crypto');
          const sourceDb=knex({client:'mssql',acquireConnectionTimeout:10000,
           connection:{server:env.PARAMETER_DB_HOST??env.DB_HOST,port:env.PARAMETER_DB_PORT??env.DB_PORT,
           user:env.PARAMETER_DB_USER??env.DB_USER,password:env.PARAMETER_DB_PASSWORD??env.DB_PASSWORD,
           database:env.PARAMETER_DB_NAME??env.DB_NAME,connectionTimeout:10000,requestTimeout:15000,
           options:{encrypt:env.PARAMETER_DB_ENCRYPT??env.DB_ENCRYPT,trustServerCertificate:env.PARAMETER_DB_TRUST_SERVER_CERTIFICATE??env.DB_TRUST_SERVER_CERTIFICATE}},pool:{min:0,max:1}});
          (async()=>{
           try{
            await query('receipts-clock',`SELECT CONVERT(VARCHAR(33),SYSDATETIME(),126) AS server_time,
             CONVERT(VARCHAR(33),SYSUTCDATETIME(),126) AS server_utc`);
            const schema=env.PARAMETER_DB_SCHEMA;
            const metadata=await sourceDb('INFORMATION_SCHEMA.TABLES').where({TABLE_SCHEMA:schema,TABLE_NAME:'connection_measurement_cleanup_receipts'})
             .select('TABLE_NAME').timeout(10000);
            output('cleanup-receipts-capability',{exists:metadata.length===1});
            if(metadata.length){
             const key=createHash('sha256').update(JSON.stringify([env.DB_HOST.toLowerCase(),env.DB_PORT,env.DB_NAME.toLowerCase()])).digest('hex');
             const receiptTable=sourceDb.ref(schema+'.connection_measurement_cleanup_receipts');
             const rows=await sourceDb(receiptTable).where('source_key',key)
              .whereBetween('cleared_at',['2026-10-30T08:15:00','2026-10-30T09:18:00'])
              .select('request_id','station_id','table_results_json')
              .select(sourceDb.raw('CONVERT(VARCHAR(33),cleared_at,126) AS cleared_at_utc'))
              .orderBy('cleared_at').timeout(15000);
             output('cleanup-receipts-in-window',rows.map(row=>({request_id:row.request_id,station_id:row.station_id,
              cleared_at_utc:row.cleared_at_utc,tables:JSON.parse(row.table_results_json).map(x=>({tableName:x.tableName,rowCount:x.rowCount,skippedMissing:x.skippedMissing}))})));
             if(rows.length){
              const ids=[...new Set(rows.map(x=>String(x.request_id)))];
              const requests=await db('cems_wpms_connection_requests').whereIn('id',ids)
                .select('id','request_no','factory_id','factory_name','factory_registration_no','status','deleted_at','created_at','updated_at').timeout(10000);
              output('cleanup-receipt-requests',requests);
             }
            }
            const fs=require('fs'),path=require('path');
            const file=path.resolve('logs','app-2026-10-30.log');
            if(fs.existsSync(file)&&fs.statSync(file).size<=5*1024*1024){
             const signals=[];
             for(const line of fs.readFileSync(file,'utf8').split(/\r?\n/u)){
              let row;try{row=JSON.parse(line);}catch{continue;}
              if(String(row.timestamp||'')<'2026-10-30T08:15:00'||String(row.timestamp||'')>'2026-10-30T09:18:00')continue;
              if(!/measurement-cleanup|cleanup could not be confirmed/iu.test(String(row.message||'')))continue;
              signals.push({timestamp:row.timestamp,level:row.level,requestId:/^\d+$/u.test(String(row.requestId))?String(row.requestId):null,
               category:'MEASUREMENT_CLEANUP_LOG'});
             }
             output('cleanup-application-signals',signals);
            }
           }finally{clearTimeout(guard);await Promise.allSettled([db.destroy(),sourceDb.destroy()]);}
          })().catch(error=>{output('failure',{code:error.code||error.name,number:error.number||error.originalError?.info?.number||null});process.exitCode=1;});
          '@ | node
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
