name: Inspect production checkout

on:
  workflow_dispatch:
    inputs:
      factory_registration_no:
        description: Factory registration reference for read-only geography audit
        required: true
        type: string
      audit_phase:
        description: Read-only geography verification phase
        required: true
        default: preflight
        type: choice
        options: [preflight, post]

permissions:
  contents: read

concurrency:
  group: poms-prod-readonly-address-audit
  cancel-in-progress: false

jobs:
  inspect:
    if: github.ref == 'refs/heads/backend/verify-factory-address-production'
    runs-on: [self-hosted, poms, windows, prod]
    timeout-minutes: 5
    defaults:
      run:
        shell: powershell
    steps:
      - name: Read runner resource and isolated test process status
        run: |
          $ErrorActionPreference = 'Stop'
          $os = Get-CimInstance Win32_OperatingSystem
          $cpu = @(Get-CimInstance Win32_Processor | Select-Object LoadPercentage, NumberOfLogicalProcessors)
          $nodes = @(Get-CimInstance Win32_Process -Filter "Name='node.exe'" | ForEach-Object {
            $kind = if ($_.CommandLine -match 'jest[\/]+bin[\/]+jest|jest\.js') { 'jest' } elseif ($_.CommandLine -match 'server\.js') { 'server' } else { 'other-node' }
            [ordered]@{ id=$_.ProcessId; parent=$_.ParentProcessId; created=$_.CreationDate.ToUniversalTime().ToString('o'); kind=$kind; cpuUser100ns=$_.UserModeTime; cpuKernel100ns=$_.KernelModeTime; memoryBytes=$_.WorkingSetSize }
          })
          $cache = Join-Path $env:GITHUB_WORKSPACE 'backend\node_modules\.cache\jest'
          $cacheInfo = if (Test-Path $cache) { Get-ChildItem $cache -File -Recurse | Measure-Object Length -Sum } else { $null }
          [ordered]@{ utc=(Get-Date).ToUniversalTime().ToString('o'); freeMemoryKB=$os.FreePhysicalMemory; totalMemoryKB=$os.TotalVisibleMemorySize; cpu=$cpu; nodes=$nodes; cachePath=$cache; cacheFiles=$cacheInfo.Count; cacheBytes=$cacheInfo.Sum } | ConvertTo-Json -Depth 5 -Compress | ForEach-Object { Write-Host "[factory-area-runner-status] $_" }
      - name: Inspect blank factory geography names without changing data
        env:
          POMS_AUDIT_PHASE: ${{ inputs.audit_phase }}
        run: |
          $ErrorActionPreference = 'Stop'
          $OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          Set-Location 'C:\apps\POMS-app'
          $head = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect production SHA.' }
          $changed = @(git diff --name-only HEAD)
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect tracked production changes.' }
          Write-Host ('[factory-area-missing-checkout] ' + (@{ head=$head; trackedChanges=$changed } | ConvertTo-Json -Compress))
          Set-Location 'C:\apps\POMS-app\backend'
          @'
          if(process.env.POMS_AUDIT_PHASE==='post'){
          const {env}=require('./dist/config/env');
          const knex=require('knex'),fs=require('fs'),path=require('path');
          const makePool=(factory=false)=>knex({client:'mssql',acquireConnectionTimeout:10000,connection:{server:factory?(env.FACTORY_DB_HOST??env.DB_HOST):env.DB_HOST,
           port:factory?(env.FACTORY_DB_PORT??env.DB_PORT):env.DB_PORT,user:factory?(env.FACTORY_DB_USER??env.DB_USER):env.DB_USER,
           password:factory?(env.FACTORY_DB_PASSWORD??env.DB_PASSWORD):env.DB_PASSWORD,database:factory?env.FACTORY_DB_NAME:env.DB_NAME,
           connectionTimeout:10000,requestTimeout:20000,options:{encrypt:factory?(env.FACTORY_DB_ENCRYPT??env.DB_ENCRYPT):env.DB_ENCRYPT,
           trustServerCertificate:factory?(env.FACTORY_DB_TRUST_SERVER_CERTIFICATE??env.DB_TRUST_SERVER_CERTIFICATE):env.DB_TRUST_SERVER_CERTIFICATE}},pool:{min:0,max:1}});
          const db=makePool(),source=makePool(true);const report={};
          const output=(stage,value)=>{(report[stage]??=[]).push(value);console.log('[factory-area-missing-post-'+stage+'] '+JSON.stringify(value));};
          const guard=setTimeout(()=>{output('failure',{code:'TIME_LIMIT'});process.exit(1);},210000);guard.unref();
          const assert=(ok,code)=>{if(!ok)throw Object.assign(new Error(code),{code});};
