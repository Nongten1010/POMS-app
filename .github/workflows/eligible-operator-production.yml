name: Eligible operator production controls

on:
  workflow_dispatch:
    inputs:
      action:
        description: Inspect, enable backend and frontend configuration, verify, or disable
        type: choice
        default: inspect
        options:
          - inspect
          - enable
          - verify
          - disable

permissions:
  contents: read

concurrency:
  group: poms-prod-deploy
  cancel-in-progress: false

jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, poms, windows, prod]
    timeout-minutes: 5
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          lfs: false
          clean: false
      - name: Inspect feature readiness without exposing user data
        if: inputs.action == 'inspect' || inputs.action == 'enable'
        env:
          AUDIT_RUN_ID: ${{ github.run_id }}
        run: ./.github/scripts/inspect-eligible-operator-production.ps1
      - name: Validate production control scripts
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE '.github/scripts/set-eligible-operator-production.ps1'), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count) { throw 'Production control script did not parse.' }
          node --test .github/scripts/eligible-operator-env.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Allowlisted environment patch tests failed.' }
      - name: Apply or verify explicitly selected production action
        if: inputs.action != 'inspect'
        env:
          CONTROL_ACTION: ${{ inputs.action }}
          AUDIT_RUN_ID: ${{ github.run_id }}
        run: ./.github/scripts/set-eligible-operator-production.ps1
